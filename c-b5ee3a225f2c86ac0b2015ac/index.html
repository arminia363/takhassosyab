<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>کپی کد</title>
<style>body{font-family:Tahoma,sans-serif;margin:0;padding:16px;background:#F5F4F1;color:#111}
button{display:block;width:100%;padding:22px 12px;font-size:22px;font-weight:700;color:#fff;background:#1a9e5c;border:0;border-radius:14px}
#m{text-align:center;margin:12px 0;font-size:18px;min-height:28px}textarea{width:100%;height:40vh;direction:ltr;font-family:monospace;font-size:11px;box-sizing:border-box}</style></head><body>
<button id="b">کپی کل کد</button><div id="m"></div>
<textarea id="t" readonly>var TZ = 'Asia/Tehran';
var ADMIN_KEY = 'ty419378';
var CHANNEL = '@JobVacencies';
var SITE = 'https://takhassosyab.ir';
var GROUP_LINK = 'https://t.me/+UqG0KBAd-pQ0YzQ0';
var API_VERSION = 2;
// قابلیت‌های سرور؛ فرانت (پنل ادمین و برنامه) با این‌ها می‌فهمد چه امکاناتی را نشان بدهد (سرور قدیمی‌تر این فیلد را ندارد)
var FEATURES = {reason:1, edit:1, bulk:1, preview:1, inboxState:1, mine:1, stats:1, dupGuard:1};
var OWNER_MOBILES = ['09123134395']; // ادمین دائمی (آرمین)؛ ادمین‌های دیگر از پنل اضافه می‌شوند

var S_LIST = 'فهرست', S_USERS = 'کاربران', S_NOTIF = 'اعلان‌ها', S_ADMINS = 'ادمین‌ها';
var H = {};
H[S_LIST]   = ['id','type','title','text','public','deleted','status','msg_id','owner','cat','city','tags','vis','target','created','updated','src','tg','data','reason'];
H[S_USERS]  = ['mobile','name','role','status','created','approved_at','tg_chat','tg_user','link_code','invite','tokens','interests','city','last_seen','tg','verified','prefs','reason','state'];
H[S_NOTIF]  = ['id','to','kind','title','body','ref','created','read'];
H[S_ADMINS] = ['chat_id','username','name','added'];
var TEXT_COLS = {}; // ستون‌هایی که باید متن بمانند (صفر اول موبایل نپرد)
TEXT_COLS[S_LIST] = ['id','owner','target','msg_id'];
TEXT_COLS[S_USERS] = ['mobile','tg_chat','link_code'];
TEXT_COLS[S_NOTIF] = ['id','to','ref'];
TEXT_COLS[S_ADMINS] = ['chat_id'];

// دسته‌های شغلی (هشتگ اصلی دپارتمان‌ها؛ هم‌خوان با فرم‌ها)
var CATS = [
  ['#فروش','فروش و بازاریابی'], ['#بازرگانی','بازرگانی'], ['#حسابداری','مالی و حسابداری'],
  ['#منابع_انسانی','منابع انسانی و اداری'], ['#خدمات_پس_از_فروش','خدمات پس از فروش و فنی'],
  ['#انبارداری','انبار و لجستیک'], ['#IT','IT و شبکه'], ['#مارکتینگ','مارکتینگ و محتوا'],
  ['#پشتیبانی','پشتیبانی مشتری'], ['#حراست','حراست و خدمات'], ['#مدیریت','مدیریت']
];
var CAT_ALIASES = {'#تعمیرات_موبایل':'#خدمات_پس_از_فروش', '#تعمیرات':'#خدمات_پس_از_فروش', '#مالی':'#حسابداری', '#اداری':'#منابع_انسانی',
  '#انبار':'#انبارداری', '#شبکه':'#IT', '#برنامه_نویس':'#IT', '#بازاریابی':'#فروش', '#فروشنده':'#فروش', '#ترخیص':'#بازرگانی', '#واردات':'#بازرگانی'};
var CAT_WORDS = [['#حسابداری',/حسابدار|مالی/],['#فروش',/فروشنده|کارشناس فروش|بازاریاب|فروش/],['#بازرگانی',/بازرگانی|ترخیص|واردات/],
  ['#IT',/برنامه.?نویس|شبکه|\bIT\b|نرم.?افزار/],['#انبارداری',/انباردار|انبار/],['#خدمات_پس_از_فروش',/تعمیر|تکنسین|گارانتی/],
  ['#مارکتینگ',/مارکتینگ|محتوا|گرافیک|اینستاگرام|سوشال/],['#منابع_انسانی',/منابع انسانی|منشی|اداری/],['#پشتیبانی',/پشتیبانی|اپراتور/],
  ['#حراست',/نگهبان|حراست|خدمات/],['#مدیریت',/مدیر/]];
var REMOTE = '#دورکاری';
// تنظیمات اعلان ادمین (ستون prefs در برگه‌ی کاربران، JSON)
var PREF_DEFAULT = {signup:1, ad:1, cv:1, private:1, direct:1, channel:0, daily:0, tg:1, app:1};

/* =========================== HTTP =========================== */
function doGet(e) {
  var p = (e &amp;&amp; e.parameter) || {};
  try {
    if (p.action === 'list') return json_({ok:true, items:legacyList_(false)});
    if (p.action === 'admin') {
      if (p.key !== ADMIN_KEY) return json_({ok:false, error:'key'});
      return json_({ok:true, items:legacyList_(true)});
    }
    if (p.action === 'feed') return json_({ok:true, items:feed_()});
    return json_({ok:true, service:'takhassosyab', v:API_VERSION, bot:botName_(), features:FEATURES});
  } catch (err) { return json_({ok:false, error:'server', detail:String(err)}); }
}

function doPost(e) {
  var d = {};
  try { d = JSON.parse(e.postData.contents); } catch (err) { d = (e &amp;&amp; e.parameter) || {}; }
  try {
    var a = d.action || '';
    if (API[a]) return json_(API[a](d));
    if (a === 'save') return json_(legacySave_(d));
    if (a === 'approve') { if (d.key !== ADMIN_KEY) return json_({ok:false, error:'key'}); return json_(approveItem_(d.id, 'پنل')); }
    if (a === 'delete') { if (d.key !== ADMIN_KEY) return json_({ok:false, error:'key'}); return json_(deleteItem_(d.id, 'پنل')); }
    if (d.type === 'employer' || d.type === 'jobseeker' || d.type === 'membership') return json_(legacyForm_(d));
    return json_({ok:false, error:'action'});
  } catch (err) {
    Logger.log('خطا: ' + err + '\n' + (err &amp;&amp; err.stack));
    return json_({ok:false, error:'server', detail:String(err)});
  }
}

var API = {
  ping: function(){ return {ok:true, v:API_VERSION, bot:botName_(), features:FEATURES}; },
  feed: function(){ return {ok:true, items:feed_()}; },
  register: function(d){ return locked_(function(){ return register_(d); }); },
  login_start: function(d){ return locked_(function(){ return loginStart_(d); }); },
  login_verify: function(d){ return locked_(function(){ return loginVerify_(d); }); },
  login_poll: function(d){ pull_(false); return loginPoll_(d); },
  me: function(d){ return me_(d); },
  profile: function(d){ return locked_(function(){ return profile_(d); }); },
  submit: function(d){ return locked_(function(){ return submit_(d); }); },
  my_delete: function(d){ return locked_(function(){
    var u = auth_(d); if (!u) return {ok:false, error:'auth'};
    var it = find_(S_LIST, 'id', d.id); if (!it || it.owner !== u.mobile) return {ok:false, error:'notfound'};
    if (it.status === 'rejected') { it.status = 'dismissed'; it.updated = now_(); save_(table_(S_LIST), it); return {ok:true}; }
    return deleteItem_(d.id, u.name || u.mobile);
  }); },
  my_edit: function(d){ return locked_(function(){ return myEdit_(d); }); },
  my_close: function(d){ return locked_(function(){ return myClose_(d, true); }); },
  my_renew: function(d){ return locked_(function(){ return myClose_(d, false); }); },
  inbox_state: function(d){ return locked_(function(){ return inboxState_(d); }); },
  saved_sync: function(d){ return locked_(function(){ return savedSync_(d); }); },
  notif_read: function(d){ return locked_(function(){
    var u = auth_(d); if (!u) return {ok:false, error:'auth'};
    var t = table_(S_NOTIF), n = 0;
    t.rows.forEach(function(r){ if (r.to === u.mobile &amp;&amp; !r.read) { r.read = '1'; save_(t, r); n++; } });
    return {ok:true, n:n};
  }); },
  // ---------- ادمین ----------
  admin_prefs: function(d){ return locked_(function(){
    var t = table_(S_USERS), u = authIn_(t, d); if (!u) return {ok:false, error:'auth'};
    if (!isAdminUser_(u)) return {ok:false, error:'key'};
    if (d.prefs &amp;&amp; typeof d.prefs === 'object') {
      var cur = prefsOf_(u);
      Object.keys(PREF_DEFAULT).forEach(function(k){ if (k in d.prefs) cur[k] = d.prefs[k] ? 1 : 0; });
      u.prefs = JSON.stringify(cur); save_(t, u);
    }
    return {ok:true, prefs:prefsOf_(u)};
  }); },
  a_list: function(d){ if (!isAdmin_(d)) return {ok:false, error:'key'}; pull_(false); return adminList_(); },
  a_user: function(d){ if (!isAdmin_(d)) return {ok:false, error:'key'}; return locked_(function(){
    if (d.op === 'approve') return approveUser_(d.mobile, 'پنل');
    if (d.op === 'reject') return rejectUser_(d.mobile, 'پنل', 'rejected', d.reason);
    if (d.op === 'block') return rejectUser_(d.mobile, 'پنل', 'blocked', d.reason);
    if (d.op === 'make_admin' || d.op === 'remove_admin') return setAdminMobile_(d.mobile, d.op === 'make_admin');
    if (d.op === 'restore') { var t = table_(S_USERS), u = findIn_(t, 'mobile', normMobile_(d.mobile)); if (!u) return {ok:false, error:'notfound'}; u.status = 'pending'; u.reason = ''; save_(t, u); return {ok:true}; }
    return {ok:false, error:'op'};
  }); },
  a_item: function(d){ if (!isAdmin_(d)) return {ok:false, error:'key'}; return locked_(function(){
    if (d.op === 'approve') return approveItem_(d.id, 'پنل');
    if (d.op === 'reject') return rejectItem_(d.id, 'پنل', d.reason);
    if (d.op === 'delete') return deleteItem_(d.id, 'پنل');
    if (d.op === 'edit') return editItem_(d, 'پنل');
    return {ok:false, error:'op'};
  }); },
  a_bulk: function(d){ if (!isAdmin_(d)) return {ok:false, error:'key'}; return locked_(function(){ return bulk_(d); }); },
  a_preview: function(d){ if (!isAdmin_(d)) return {ok:false, error:'key'}; return locked_(function(){ return preview_(d); }); },
  a_add: function(d){ if (!isAdmin_(d)) return {ok:false, error:'key'}; return locked_(function(){
    var it = newItem_({type:d.type === 'jobseeker' ? 'jobseeker' : 'employer', title:d.title, text:d.text, status:'approved', src:'admin', public:'بله'});
    if (d.post) { var r = postToChannel(itemPostText_(it)); if (r.ok) { it.msg_id = String(r.msgId); save_(table_(S_LIST), it); } }
    afterPublished_(it);
    return {ok:true, id:it.id};
  }); }
};

/* =========================== کاربران =========================== */
function register_(d) {
  var mobile = normMobile_(d.mobile), name = clean_(d.name, 60), role = d.role === 'employer' ? 'employer' : 'jobseeker';
  if (!mobile) return {ok:false, error:'mobile'};
  if (!name) return {ok:false, error:'name'};
  var t = table_(S_USERS), u = findIn_(t, 'mobile', mobile), isNew = !u;
  if (u &amp;&amp; (u.status === 'blocked')) return {ok:false, error:'blocked'};
  if (u &amp;&amp; u.status === 'approved') return {ok:false, error:'exists', needLogin:true}; // عضو تأییدشده باید با تلگرام وارد شود
  if (!u) u = {mobile:mobile, created:now_(), status:'pending'};
  if (u.status === 'rejected') { u.status = 'pending'; u.reason = ''; }
  u.name = name; u.role = role; if (d.city) u.city = clean_(d.city, 40);
  if (!u.link_code) u.link_code = rand_(10);
  var token = rand_(24);
  u.tokens = addToken_(u.tokens, token);
  u.last_seen = now_();
  save_(t, u);
  legacyMemberRow_(u);
  if (isNew || u.status === 'pending') notifyAdminsUser_(u, isNew);
  return {ok:true, token:token, user:pubUser_(u)};
}

function loginStart_(d) {
  var mobile = normMobile_(d.mobile); if (!mobile) return {ok:false, error:'mobile'};
  var u = find_(S_USERS, 'mobile', mobile);
  if (!u) return {ok:false, error:'nouser'};
  if (u.status === 'blocked') return {ok:false, error:'blocked'};
  var cache = CacheService.getScriptCache();
  if (u.tg_chat) {
    var code = String(Math.floor(10000 + Math.random() * 90000));
    cache.put('lc_' + mobile, code, 600);
    var r = tgSend_(u.tg_chat, '🔐 کد ورود تخصص‌یاب: ' + code + '\nاین کد را به کسی نده. اگر درخواست ورود نداده‌ای، این پیام را نادیده بگیر.');
    if (r &amp;&amp; r.ok) return {ok:true, via:'code'};
  }
  var nonce = rand_(12);
  cache.put('ln_' + nonce, JSON.stringify({mobile:mobile}), 900);
  return {ok:true, via:'telegram', nonce:nonce, link:botLink_('G' + nonce)};
}

function loginVerify_(d) {
  var mobile = normMobile_(d.mobile), code = toEn_(String(d.code || '')).replace(/\D/g, '');
  var cache = CacheService.getScriptCache(), k = 'lc_' + mobile, real = cache.get(k);
  var tries = Number(cache.get('lt_' + mobile) || 0);
  if (tries &gt;= 5) return {ok:false, error:'tries'};
  if (!real || real !== code) { cache.put('lt_' + mobile, String(tries + 1), 600); return {ok:false, error:'code'}; }
  cache.remove(k);
  return issueToken_(mobile);
}

function loginPoll_(d) {
  var cache = CacheService.getScriptCache(), raw = cache.get('ln_' + String(d.nonce || ''));
  if (!raw) return {ok:false, error:'expired'};
  var o = JSON.parse(raw);
  if (!o.ok) return {ok:true, waiting:true};
  cache.remove('ln_' + d.nonce);
  return locked_(function(){ return issueToken_(o.mobile); });
}

function issueToken_(mobile) {
  var t = table_(S_USERS), u = findIn_(t, 'mobile', mobile);
  if (!u) return {ok:false, error:'nouser'};
  var token = rand_(24); u.tokens = addToken_(u.tokens, token); u.last_seen = now_(); save_(t, u);
  return {ok:true, token:token, user:pubUser_(u)};
}

function me_(d) {
  var u = auth_(d); if (!u) return {ok:false, error:'auth'};
  if (!u.tg_chat || u.status === 'pending') { pull_(false); u = auth_(d); }
  var notifs = table_(S_NOTIF).rows.filter(function(n){ return n.to === u.mobile; })
    .slice(-60).reverse().map(function(n){ return {id:n.id, kind:n.kind, title:n.title, body:n.body, ref:n.ref, at:n.created, read:!!n.read}; });
  var items = table_(S_LIST).rows, mine = [], myAds = {}, inbox = [];
  items.forEach(function(it){
    if (it.owner !== u.mobile || it.deleted === 'بله') return;
    if (it.type === 'employer') myAds[it.id] = it.title;
  });
  items.forEach(function(it){
    if (it.owner !== u.mobile || it.type === 'membership') return;
    var gone = it.deleted === 'بله';
    if (gone &amp;&amp; it.status !== 'rejected') return; // رد‌شده‌ها برای نمایش دلیل می‌مانند تا کاربر خودش حذف کند
    var tg = it.target ? find_(S_LIST, 'id', it.target) : null;
    var dj = String(it.data || '').length &lt;= 8000 ? parseJ_(it.data, null) : null;
    mine.push({id:it.id, type:it.type, title:it.title, status:it.status, vis:it.vis, created:it.created, updated:it.updated, text:it.text, cat:it.cat, city:it.city,
      tags:it.tags, data:dj, target:it.target, targetTitle:tg ? tg.title : '', reason:(it.status === 'rejected' || it.status === 'closed') ? it.reason : '', msg:it.msg_id || ''});
  });
  var st = userState_(u);
  items.forEach(function(it){
    if (it.vis === 'direct' &amp;&amp; myAds[it.target] &amp;&amp; it.deleted !== 'بله')
      inbox.push({id:it.id, title:it.title, text:it.text, cat:it.cat, city:it.city, created:it.created, ad:it.target, adTitle:myAds[it.target], state:st.inbox[it.id] || ''});
  });
  var adm = isAdminUser_(u);
  return {ok:true, user:pubUser_(u), adminPrefs:adm ? prefsOf_(u) : undefined, notifs:notifs, unread:notifs.filter(function(n){return !n.read;}).length,
    mine:mine.reverse(), inbox:inbox.reverse(), saved:st.saved, features:FEATURES, bot:botName_(), group:u.status === 'approved' ? GROUP_LINK : ''};
}

function profile_(d) {
  var t = table_(S_USERS), u = authIn_(t, d); if (!u) return {ok:false, error:'auth'};
  if (d.name) u.name = clean_(d.name, 60);
  if (d.city != null) u.city = clean_(d.city, 40);
  if (d.role === 'employer' || d.role === 'jobseeker') u.role = d.role;
  if (d.interests != null) u.interests = normCats_(String(d.interests)).join(' ');
  if (d.logout) u.tokens = String(u.tokens || '').split(' ').filter(function(x){ return x &amp;&amp; x !== d.token; }).join(' ');
  save_(t, u);
  return {ok:true, user:pubUser_(u)};
}

function approveUser_(mobile, actor) {
  mobile = normMobile_(mobile);
  var t = table_(S_USERS), u = findIn_(t, 'mobile', mobile);
  if (!u) return {ok:false, error:'notfound'};
  if (u.status === 'approved') return {ok:true, already:true, invite:u.invite};
  u.status = 'approved'; u.approved_at = now_();
  if (!u.invite) u.invite = createInvite_(u);
  save_(t, u);
  legacyMemberRow_(u);
  var body = 'به تخصص‌یاب خوش آمدی. حالا به همه‌ی آگهی‌ها و رزومه‌ها دسترسی داری.\nلینک ورود به کانال: ' + u.invite + '\nگروه گفتگو: ' + GROUP_LINK;
  notify_(u, 'approved', 'عضویت شما تأیید شد', body, '', {url:SITE + '/enter.html', urlText:'ورود به برنامه'});
  editAdminMsgs_(u.tg, adminUserText_(u) + '\n\n✅ تأیید شد · ' + actor);
  u.tg = ''; save_(t, u);
  return {ok:true, invite:u.invite};
}

function rejectUser_(mobile, actor, status, reason) {
  mobile = normMobile_(mobile);
  var t = table_(S_USERS), u = findIn_(t, 'mobile', mobile);
  if (!u) return {ok:false, error:'notfound'};
  reason = clean_(reason, 200);
  u.status = status || 'rejected'; u.reason = reason; save_(t, u);
  legacyMemberRow_(u);
  if (status !== 'blocked') notify_(u, 'rejected', 'درخواست عضویت تأیید نشد', (reason ? 'دلیل: ' + reason + '\n' : '') + 'می‌توانی اطلاعاتت را اصلاح و دوباره درخواست بدهی. اگر فکر می‌کنی اشتباه شده، به ادمین پیام بده: @arminia363', '');
  editAdminMsgs_(u.tg, adminUserText_(u) + '\n\n❌ ' + (status === 'blocked' ? 'مسدود شد' : 'رد شد') + ' · ' + actor + (reason ? '\nدلیل: ' + reason : ''));
  // فقط مسدودسازی ردپای پیام‌های ادمین را پاک می‌کند؛ رد شدن اتصال تلگرام و پیام‌ها را نگه می‌دارد تا «درخواست دوباره» کار کند
  if (status === 'blocked') { u.tg = ''; save_(t, u); }
  return {ok:true};
}

function createInvite_(u) {
  var r = tg_('createChatInviteLink', {chat_id:CHANNEL, member_limit:1, name:('عضو ' + u.mobile.slice(-4))});
  if (r &amp;&amp; r.ok &amp;&amp; r.result &amp;&amp; r.result.invite_link) return r.result.invite_link;
  return 'https://t.me/' + CHANNEL.replace('@', '');
}

/* =========================== آگهی و رزومه =========================== */
function submit_(d) {
  var t = table_(S_USERS), u = authIn_(t, d); if (!u) return {ok:false, error:'auth'};
  if (u.status === 'blocked' || u.status === 'rejected') return {ok:false, error:'status'};
  var type = d.type === 'jobseeker' ? 'jobseeker' : 'employer';
  var text = clean_(d.text, 4000, true);
  if (text.length &lt; 20) return {ok:false, error:'text'};
  var dupId = dupOf_(u.mobile, type, d.type === 'jobseeker' &amp;&amp; d.vis === 'direct' ? String(d.target || '') : '', text);
  if (dupId) return {ok:true, dup:true, id:dupId.id, status:dupId.status};
  var cache = CacheService.getScriptCache(), rk = 'rs_' + u.mobile, cnt = Number(cache.get(rk) || 0);
  if (cnt &gt;= 15) return {ok:false, error:'rate'};
  cache.put(rk, String(cnt + 1), 21600);
  var vis = type === 'employer' ? 'channel' : (['channel','admin','direct'].indexOf(d.vis) &gt;= 0 ? d.vis : 'channel');
  var target = '';
  if (vis === 'direct') {
    var ad = find_(S_LIST, 'id', d.target);
    if (!ad || ad.type !== 'employer' || ad.deleted === 'بله') return {ok:false, error:'target'};
    target = ad.id;
  }
  var status = vis === 'channel' ? 'pending' : (vis === 'admin' ? 'private' : 'direct');
  var cats = normCats_((d.tags || '') + ' ' + (d.cat || '') + ' ' + text);
  var it = newItem_({type:type, title:clean_(d.title || d.name, 120), text:text, owner:u.mobile, status:status, vis:vis, target:target,
    public:(vis === 'channel' ? 'بله' : ''), cat:cats.join(' '), city:clean_(d.city, 60), tags:clean_(d.tags, 300), src:'app',
    data:JSON.stringify(d.fields || {}).slice(0, 20000)});
  rawLog_(type, it, d.contact);
  // علاقه‌مندی کاربر برای تطبیق
  if (cats.length) { u.interests = normCats_((u.interests || '') + ' ' + cats.join(' ')).join(' '); if (!u.city &amp;&amp; it.city) u.city = it.city; save_(t, u); }
  if (status === 'pending') notifyAdminsItem_(it, u);
  else if (status === 'private') notifyAdminsInfo_('📥 رزومه فقط برای ادمین\n' + itemSummary_(it, u), 'private');
  else deliverDirect_(it, u);
  return {ok:true, id:it.id, status:status};
}

function deliverDirect_(it, u) {
  var ad = find_(S_LIST, 'id', it.target);
  var owner = ad &amp;&amp; ad.owner ? find_(S_USERS, 'mobile', ad.owner) : null;
  if (owner) {
    notify_(owner, 'resume_direct', 'رزومه برای آگهی «' + (ad.title || 'شما') + '»', (it.title || 'رزومه') + '\n\n' + it.text, it.id,
      {url:SITE + '/inbox.html', urlText:'مشاهده در برنامه', full:true});
    notify_(u, 'sent', 'رزومه‌ات برای کارفرما ارسال شد', 'آگهی: ' + (ad.title || ''), it.id, {noDm:true});
    notifyAdminsInfo_('📨 رزومه‌ی مستقیم برای «' + (ad.title || '') + '»\n' + itemSummary_(it, u), 'direct');
  } else {
    notify_(u, 'sent', 'رزومه‌ات ارسال شد', 'این آگهی از کانال آمده؛ رزومه‌ات را ادمین به کارفرما می‌رساند.', it.id, {noDm:true});
    notifyAdminsInfo_('📨 رزومه برای آگهی «' + (ad ? ad.title : '') + '» (صاحب آگهی در برنامه نیست؛ لطفاً دستی برسان)\n' + itemSummary_(it, u) + '\n\n' + it.text);
  }
}

function approveItem_(id, actor) {
  var t = table_(S_LIST), it = findIn_(t, 'id', id);
  if (!it) return {ok:false, error:'notfound'};
  if (it.deleted === 'بله') return {ok:false, error:'deleted'};
  if (it.type === 'membership') return approveUser_(it.id, actor);
  if (it.status === 'approved' &amp;&amp; it.msg_id) return {ok:true, already:true, msgId:it.msg_id};
  var res;
  if (it.msg_id &amp;&amp; it.status !== 'approved') { // ویرایش‌شده‌ی منتشرشده: همان پست کانال به‌روز می‌شود، پست تازه نمی‌سازیم
    var er = editChannel_(it.msg_id, itemPostText_(it));
    res = er.ok ? {ok:true, msgId:it.msg_id} : postToChannel(itemPostText_(it));
  } else res = postToChannel(itemPostText_(it));
  if (!res.ok) return {ok:false, error:'telegram', detail:res.detail};
  it.reason = '';
  it.status = 'approved'; it.msg_id = String(res.msgId); it.public = 'بله'; if (it.vis !== 'channel' &amp;&amp; it.type === 'jobseeker') it.vis = 'channel';
  it.updated = now_(); save_(t, it);
  editAdminMsgs_(it.tg, adminItemText_(it) + '\n\n✅ منتشر شد · ' + actor);
  it.tg = ''; save_(t, it);
  var owner = it.owner ? find_(S_USERS, 'mobile', it.owner) : null;
  if (owner) notify_(owner, 'published', it.type === 'employer' ? 'آگهی شما منتشر شد' : 'رزومه شما منتشر شد',
    '«' + (it.title || '') + '» حالا در کانال @JobVacencies و برنامه دیده می‌شود.', it.id, {url:'https://t.me/' + CHANNEL.replace('@','') + '/' + it.msg_id, urlText:'دیدن در کانال'});
  afterPublished_(it);
  return {ok:true, msgId:res.msgId};
}

function rejectItem_(id, actor, reason) {
  var t = table_(S_LIST), it = findIn_(t, 'id', id);
  if (!it) return {ok:false, error:'notfound'};
  reason = clean_(reason, 200);
  it.status = 'rejected'; it.deleted = 'بله'; it.reason = reason; it.updated = now_(); save_(t, it);
  if (it.msg_id) deleteFromChannel(it.msg_id);
  editAdminMsgs_(it.tg, adminItemText_(it) + '\n\n❌ رد شد · ' + actor + (reason ? '\nدلیل: ' + reason : ''));
  it.tg = ''; save_(t, it);
  var owner = it.owner ? find_(S_USERS, 'mobile', it.owner) : null;
  if (owner) notify_(owner, 'rejected_item', (it.type === 'employer' ? 'آگهی' : 'رزومه') + ' شما تأیید نشد',
    '«' + (it.title || '') + '» منتشر نشد.' + (reason ? '\nدلیل: ' + reason : '') + '\nمی‌توانی آن را از «ارسال‌های من» ویرایش و دوباره بفرستی. برای جزئیات به ادمین پیام بده: @arminia363', it.id);
  cacheDrop_();
  return {ok:true};
}

function deleteItem_(id, actor) {
  var t = table_(S_LIST), hit = false;
  t.rows.forEach(function(it){
    if (String(it.id) !== String(id)) return;
    hit = true;
    if (it.type === 'membership' &amp;&amp; it.deleted !== 'بله') { var u = find_(S_USERS, 'mobile', normMobile_(it.id)); if (u &amp;&amp; u.status === 'pending') rejectUser_(u.mobile, actor, 'rejected'); }
    it.deleted = 'بله'; it.updated = now_();
    if (it.msg_id) { deleteFromChannel(it.msg_id); }
    if (it.tg) { editAdminMsgs_(it.tg, adminItemText_(it) + '\n\n🗑 حذف شد · ' + actor); it.tg = ''; }
    save_(t, it);
  });
  cacheDrop_();
  return hit ? {ok:true} : {ok:false, error:'notfound'};
}

function newItem_(o) {
  var t = table_(S_LIST);
  var it = {id:o.id || uid_(), type:o.type, title:o.title || '', text:o.text || '', public:o.public || '', deleted:'', status:o.status || 'pending',
    msg_id:o.msg_id || '', owner:o.owner || '', cat:o.cat || normCats_((o.tags || '') + ' ' + (o.text || '')).join(' '), city:o.city || cityOf_(o.text),
    tags:o.tags || '', vis:o.vis || (o.type === 'employer' ? 'channel' : ''), target:o.target || '', created:now_(), updated:now_(), src:o.src || '', tg:'', data:o.data || '', reason:''};
  save_(t, it);
  cacheDrop_();
  return it;
}

function itemPostText_(it) {
  var txt = String(it.text || '');
  if (it.type === 'employer' &amp;&amp; it.owner &amp;&amp; txt.indexOf('takhassosyab.ir') &lt; 0) txt += '\n\n📩 ارسال رزومه از برنامه: ' + SITE + '/jobs.html?id=' + it.id;
  return txt;
}

/* =========================== تطبیق و اعلان =========================== */
function afterPublished_(it) {
  cacheDrop_();
  var cats = String(it.cat || '').split(' ').filter(String);
  if (!cats.length) return 0;
  var users = table_(S_USERS).rows, n = 0, sent = {};
  var ads = it.type === 'jobseeker' ? table_(S_LIST).rows.filter(function(a){ return a.type === 'employer' &amp;&amp; a.owner &amp;&amp; a.deleted !== 'بله' &amp;&amp; a.status === 'approved'; }) : [];
  users.forEach(function(u){
    if (u.status !== 'approved' || u.mobile === it.owner || sent[u.mobile] || n &gt;= 300) return;
    var match = null;
    if (it.type === 'jobseeker' &amp;&amp; u.role === 'employer') {
      ads.forEach(function(a){ if (!match &amp;&amp; a.owner === u.mobile &amp;&amp; overlap_(a.cat, cats) &amp;&amp; cityOk_(a.city, it.city)) match = a; });
      if (!match &amp;&amp; overlap_(u.interests, cats) &amp;&amp; cityOk_(u.city, it.city)) match = {title:''};
      if (match) {
        sent[u.mobile] = 1; n++;
        notify_(u, 'match', 'رزومه‌ی مرتبط' + (match.title ? ' با آگهی «' + match.title + '»' : ''), (it.title || 'رزومه') + '\n' + firstLines_(it.text, 6), it.id,
          {url:SITE + '/resumes.html?id=' + it.id, urlText:'مشاهده رزومه'});
      }
    } else if (it.type === 'employer' &amp;&amp; u.role === 'jobseeker') {
      if (overlap_(u.interests, cats) &amp;&amp; cityOk_(u.city, it.city)) {
        sent[u.mobile] = 1; n++;
        notify_(u, 'match', 'آگهی مرتبط با تخصص تو', (it.title || 'آگهی استخدام') + '\n' + firstLines_(it.text, 6), it.id,
          {url:SITE + '/jobs.html?id=' + it.id, urlText:'مشاهده آگهی'});
      }
    }
  });
  return n;
}

function notify_(u, kind, title, body, ref, opt) {
  opt = opt || {};
  var t = table_(S_NOTIF);
  save_(t, {id:uid_(), to:u.mobile, kind:kind, title:title, body:String(body || '').slice(0, 3000), ref:ref || '', created:now_(), read:''});
  if (u.tg_chat &amp;&amp; !opt.noDm) {
    var msg = '🔔 ' + title + '\n\n' + (opt.full ? body : firstLines_(body, 12));
    var kb = opt.url ? {inline_keyboard:[[{text:opt.urlText || 'باز کردن', url:opt.url}]]} : null;
    tgSend_(u.tg_chat, msg, kb);
  }
}

function admins_() { return table_(S_ADMINS).rows.filter(function(a){ return a.chat_id; }); }

/** گیرنده‌های اعلان ادمین: کاربران ادمین (موبایل/چت تلگرام) + چت‌های ثبت‌شده در برگه‌ی ادمین‌ها. */
function adminTargets_() {
  var out = [], byChat = {};
  table_(S_USERS).rows.forEach(function(u){
    if (!isAdminUser_(u)) return;
    out.push({chat:u.tg_chat || '', user:u});
    if (u.tg_chat) byChat[u.tg_chat] = 1;
  });
  admins_().forEach(function(a){ var c = String(a.chat_id); if (!byChat[c]) { byChat[c] = 1; out.push({chat:c, user:null}); } });
  return out;
}
function prefsOf_(u) {
  var p = parseJ_(u &amp;&amp; u.prefs, {}), o = {};
  if (!p || typeof p !== 'object') p = {};
  Object.keys(PREF_DEFAULT).forEach(function(k){ o[k] = (k in p) ? (p[k] ? 1 : 0) : PREF_DEFAULT[k]; });
  return o;
}
/** key = signup|ad|cv|private|direct|channel|daily. خروجی: [[chat,msgId],...] پیام‌های تلگرام ارسال‌شده. */
function adminSend_(key, title, text, kb, ref) {
  var pairs = [];
  adminTargets_().forEach(function(t){
    var p = prefsOf_(t.user);
    if (!p[key]) return;
    if (p.tg &amp;&amp; t.chat) { var r = tgSend_(t.chat, text, kb); if (r &amp;&amp; r.ok) pairs.push([t.chat, r.result.message_id]); }
    if (p.app &amp;&amp; t.user) save_(table_(S_NOTIF), {id:uid_(), to:t.user.mobile, kind:'admin_' + key, title:title, body:firstLines_(text, 4).slice(0, 600), ref:ref || '', created:now_(), read:''});
  });
  return pairs;
}

function notifyAdminsItem_(it, u) {

  var pairs = adminSend_(it.type === 'employer' ? 'ad' : 'cv', kind + ' جدید: ' + (it.title || ''), adminItemText_(it), kb, it.id);

/** key: private | direct | channel */
function notifyAdminsInfo_(text, key) {
  key = key || 'private';

}

function adminUserText_(u) {

    '\nتلگرام: ' + (u.tg_chat ? (u.tg_user ? '@' + u.tg_user : 'متصل') + (u.verified ? ' (شماره تأییدشده)' : '') : 'متصل نشده');
}
function adminItemText_(it) {
  var head = (it.type === 'employer' ? '🏢 آگهی استخدام برای تأیید' : '📄 رزومه برای تأیید') + (it.msg_id &amp;&amp; it.status === 'pending' ? ' (ویرایش‌شده توسط فرستنده)' : '');
  return head + '\n\n' + String(it.text || '').slice(0, 3200);
}
function itemSummary_(it, u) { return (it.title || '') + '\n' + (u ? u.name + ' · ' + u.mobile : ''); }

function editAdminMsgs_(tgJson, text, kb) {
  parseJ_(tgJson, []).forEach(function(p){ var o = {chat_id:p[0], message_id:p[1], text:String(text).slice(0, 4000)}; if (kb) o.reply_markup = kb; tg_('editMessageText', o); });
}

/* =========================== تلگرام =========================== */
function postToChannel(text) {
  if (!text) { Logger.log('متن خالی است'); return {ok:false, detail:'empty'}; }
  var j = tg_('sendMessage', {chat_id:CHANNEL, text:String(text).slice(0, 4000), disable_web_page_preview:true});
  if (j &amp;&amp; j.ok) return {ok:true, msgId:j.result.message_id};
  return {ok:false, detail:(j &amp;&amp; j.description) || 'no response'};
}
function deleteFromChannel(msgId) { if (msgId) tg_('deleteMessage', {chat_id:CHANNEL, message_id:Number(msgId)}); }
function testChannel() { postToChannel('🧪 تست اتصال ربات تخصص‌یاب'); }

function tgSend_(chat, text, kb) {
  var p = {chat_id:chat, text:String(text).slice(0, 4000), disable_web_page_preview:true};
  if (kb) p.reply_markup = kb;
  return tg_('sendMessage', p);
}

function tg_(method, payload) {
  var token = PropertiesService.getScriptProperties().getProperty('BOT_TOKEN');
  if (!token) { Logger.log('BOT_TOKEN ذخیره نشده'); return {ok:false, description:'no token'}; }
  try {
    var r = UrlFetchApp.fetch('https://api.telegram.org/bot' + token + '/' + method,
      {method:'post', contentType:'application/json', payload:JSON.stringify(payload || {}), muteHttpExceptions:true});
    var j = JSON.parse(r.getContentText());
    if (!j.ok &amp;&amp; method !== 'editMessageText' &amp;&amp; method !== 'deleteMessage') Logger.log('تلگرام ' + method + ': ' + r.getContentText());
    return j;
  } catch (err) { Logger.log('تلگرام خطا ' + method + ': ' + err); return {ok:false, description:String(err)}; }
}

function botName_() {
  var p = PropertiesService.getScriptProperties(), n = p.getProperty('BOT_USERNAME');
  if (n) return n;
  var r = tg_('getMe', {});
  if (r &amp;&amp; r.ok) { n = r.result.username; p.setProperty('BOT_USERNAME', n); return n; }
  return 'Takhasosbot';
}
function botLink_(payload) { return 'https://t.me/' + botName_() + '?start=' + payload; }

/** هر دقیقه با تریگر اجرا می‌شود: پیام‌ها و دکمه‌های ربات و پست‌های کانال را می‌خواند. */
function tick() { pull_(true); try { dailySummary_(false); } catch (err) { Logger.log('daily: ' + err); } }

/** خلاصه‌ی روزانه (ساعت ۹ صبح به بعد، یک بار در روز) برای ادمین‌هایی که روشنش کرده‌اند. */
function dailySummary_(force) {
  var p = PropertiesService.getScriptProperties(), today = now_().slice(0, 10);
  if (!force &amp;&amp; (Number(now_().slice(11, 13)) &lt; 9 || p.getProperty('DAILY_AT') === today)) return 0;
  p.setProperty('DAILY_AT', today);
  return locked_(function(){
    var us = table_(S_USERS).rows.filter(function(u){ return u.status === 'pending'; }).length;
    var its = table_(S_LIST).rows.filter(function(r){ return r.status === 'pending' &amp;&amp; r.deleted !== 'بله' &amp;&amp; (r.type === 'employer' || r.type === 'jobseeker'); });
    var ads = its.filter(function(r){ return r.type === 'employer'; }).length, cvs = its.length - ads;
    if (!us &amp;&amp; !ads &amp;&amp; !cvs) return 0;
    var text = '🗓 خلاصه‌ی روزانه تخصص‌یاب\nعضویت در انتظار: ' + us + '\nآگهی در انتظار: ' + ads + '\nرزومه در انتظار: ' + cvs + '\nپنل: ' + SITE + '/admin.html';
    adminSend_('daily', 'خلاصه‌ی روزانه', text, null, '');
    return 1;
  });
}

function pull_(force) {
  var p = PropertiesService.getScriptProperties();
  var last = Number(p.getProperty('TG_PULL_AT') || 0), nowMs = new Date().getTime();
  if (!force &amp;&amp; nowMs - last &lt; 4000) return 0;
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(5000)) return 0;
  var n = 0;
  _T = {};
  try {
    p.setProperty('TG_PULL_AT', String(nowMs));
    var off = Number(p.getProperty('TG_OFFSET') || 0);
    var r = tg_('getUpdates', {offset:off, timeout:0, limit:50, allowed_updates:['message','callback_query','channel_post']});
    if (!r || !r.ok) return 0;
    r.result.forEach(function(u){
      try { handleUpdate_(u); n++; } catch (err) { Logger.log('update ' + u.update_id + ': ' + err + '\n' + err.stack); }
      p.setProperty('TG_OFFSET', String(u.update_id + 1));
    });
  } finally { lock.releaseLock(); }
  return n;
}

function handleUpdate_(up) {
  if (up.callback_query) return onCallback_(up.callback_query);
  if (up.channel_post) return onChannelPost_(up.channel_post);
  var m = up.message; if (!m || !m.chat || m.chat.type !== 'private') return;
  var chat = String(m.chat.id), from = m.from || {}, text = String(m.text || '').trim();
  if (m.contact) return onContact_(m);
  if (/^\/start\b/.test(text)) {
    var arg = text.replace(/^\/start\s*/, '');
    if (arg.indexOf('adm_') === 0) {
      if (arg.slice(4) === PropertiesService.getScriptProperties().getProperty('ADMIN_LINK')) return addAdmin_(m);
      return tgSend_(chat, 'لینک ادمین معتبر نیست.');
    }
    if (arg.charAt(0) === 'L') return linkUser_(m, arg.slice(1));
    if (arg.charAt(0) === 'G') return startLogin_(m, arg.slice(1));
    return tgSend_(chat, 'سلام! این ربات تخصص‌یاب است 👋\nآگهی‌ها و رزومه‌ها: ' + SITE + '/enter.html\nکانال: ' + CHANNEL,
      {inline_keyboard:[[{text:'ورود به برنامه', url:SITE + '/enter.html'}]]});
  }
  if (/^\/admin\b/.test(text)) {
    if (text.replace(/^\/admin\s*/, '') === ADMIN_KEY) return addAdmin_(m);
    return tgSend_(chat, 'رمز نادرست است.');
  }
  if (isAdminChat_(chat)) return tgSend_(chat, 'درخواست‌های جدید همین‌جا با دکمه‌ی ✅/❌ برایت می‌آید. پنل کامل: ' + SITE + '/admin.html');
  return tgSend_(chat, 'برای ثبت آگهی یا رزومه وارد برنامه شو: ' + SITE + '/enter.html');
}

function addAdmin_(m) {
  var t = table_(S_ADMINS), chat = String(m.chat.id), a = findIn_(t, 'chat_id', chat), from = m.from || {};
  if (!a) a = {chat_id:chat, added:now_()};
  a.username = from.username || ''; a.name = ((from.first_name || '') + ' ' + (from.last_name || '')).trim();
  save_(t, a);
  tgSend_(chat, '✅ ادمین تخصص‌یاب شدی. از این به بعد درخواست‌های عضویت، آگهی‌ها و رزومه‌ها با دکمه‌ی تأیید/رد همین‌جا می‌آید.');
  return true;
}
function isAdminChat_(chat) { return !!find_(S_ADMINS, 'chat_id', String(chat)); }

function linkUser_(m, code) {
  var chat = String(m.chat.id), t = table_(S_USERS), u = code ? findIn_(t, 'link_code', code) : null;
  if (!u) return tgSend_(chat, 'این لینک معتبر نیست. از داخل برنامه دوباره «اتصال تلگرام» را بزن.');
  u.tg_chat = chat; u.tg_user = (m.from &amp;&amp; m.from.username) || ''; save_(t, u);
  var msg = 'سلام ' + (u.name || '') + '! تلگرامت به تخصص‌یاب وصل شد ✅\n';
  msg += u.status === 'approved' ? ('عضویتت فعال است.\nلینک کانال: ' + u.invite) : 'درخواست عضویتت برای ادمین رفته؛ نتیجه همین‌جا خبرت می‌کنیم.';
  msg += '\n\nبرای امنیت بیشتر، با دکمه‌ی پایین شماره‌ات را تأیید کن.';
  tgSend_(chat, msg, {keyboard:[[{text:'📱 تأیید شماره موبایل', request_contact:true}]], resize_keyboard:true, one_time_keyboard:true});
  if (u.tg &amp;&amp; u.status === 'pending') editAdminMsgs_(u.tg, adminUserText_(u));
  return true;
}

function startLogin_(m, nonce) {
  var chat = String(m.chat.id), cache = CacheService.getScriptCache(), raw = cache.get('ln_' + nonce);
  if (!raw) return tgSend_(chat, 'این لینک ورود منقضی شده؛ در برنامه دوباره «ورود» را بزن.');
  cache.put('lchat_' + chat, nonce, 900);
  return tgSend_(chat, 'برای ورود به تخصص‌یاب، دکمه‌ی پایین را بزن تا شماره‌ات تأیید شود.',
    {keyboard:[[{text:'📱 ارسال شماره و ورود', request_contact:true}]], resize_keyboard:true, one_time_keyboard:true});
}

function onContact_(m) {
  var chat = String(m.chat.id), c = m.contact;
  if (!c || String(c.user_id) !== String(m.from.id)) return tgSend_(chat, 'لطفاً شماره‌ی خودت را با همان دکمه بفرست.', {remove_keyboard:true});
  var mobile = normMobile_(c.phone_number), t = table_(S_USERS), u = findIn_(t, 'mobile', mobile);
  var cache = CacheService.getScriptCache(), nonce = cache.get('lchat_' + chat);
  if (!u) return tgSend_(chat, 'با شماره‌ی ' + mobile + ' هنوز در تخصص‌یاب ثبت‌نام نشده. از برنامه ثبت‌نام کن: ' + SITE + '/register.html', {remove_keyboard:true});
  if (u.tg_chat &amp;&amp; u.tg_chat !== chat &amp;&amp; !nonce) return tgSend_(chat, 'این شماره به حساب تلگرام دیگری وصل است.', {remove_keyboard:true});
  u.tg_chat = chat; u.tg_user = m.from.username || ''; u.verified = '1'; save_(t, u);
  if (nonce) {
    var raw = cache.get('ln_' + nonce);
    if (raw) { var o = JSON.parse(raw); if (o.mobile === mobile) { o.ok = true; cache.put('ln_' + nonce, JSON.stringify(o), 600); cache.remove('lchat_' + chat);
      return tgSend_(chat, '✅ ورود تأیید شد. به برنامه برگرد.', {remove_keyboard:true}); }
      return tgSend_(chat, 'شماره‌ی تلگرام با شماره‌ای که در برنامه زدی یکی نیست.', {remove_keyboard:true}); }
  }
  return tgSend_(chat, '✅ شماره‌ات تأیید شد. ممنون!', {remove_keyboard:true});
}

function onCallback_(q) {
  var chat = String((q.message &amp;&amp; q.message.chat &amp;&amp; q.message.chat.id) || q.from.id);
  var admin = find_(S_ADMINS, 'chat_id', String(q.from.id));
  if (!admin) { tg_('answerCallbackQuery', {callback_query_id:q.id, text:'فقط ادمین‌ها', show_alert:true}); return; }
  var who = q.from.username ? '@' + q.from.username : (q.from.first_name || 'ادمین');
  var p = String(q.data || '').split(':'), res = {ok:false};
  // (قفل اسکریپت از قبل در pull_ گرفته شده است)
  if (p[0] === 'u') res = p[1] === 'a' ? approveUser_(p[2], who) : rejectUser_(p[2], who, 'rejected');
  else if (p[0] === 'i') res = p[1] === 'a' ? approveItem_(p.slice(2).join(':'), who) : rejectItem_(p.slice(2).join(':'), who);
  tg_('answerCallbackQuery', {callback_query_id:q.id, text:res.ok ? (res.already ? 'قبلاً انجام شده' : 'انجام شد ✅') : ('خطا: ' + (res.detail || res.error || ''))});
  if (res.ok &amp;&amp; res.already &amp;&amp; q.message) tg_('editMessageReplyMarkup', {chat_id:chat, message_id:q.message.message_id, reply_markup:{inline_keyboard:[]}});
}

function onChannelPost_(m) {
  var uname = m.chat &amp;&amp; m.chat.username ? '@' + m.chat.username : '';
  if (uname.toLowerCase() !== CHANNEL.toLowerCase()) return;
  var text = String(m.text || m.caption || '');
  if (!text || text.indexOf('takhassosyab.ir') &gt;= 0) return; // پست‌های معرفی خود کانال
  var hasContact = /09\d{9}|۰۹[۰-۹]{9}|@[A-Za-z]\w{3,}|t\.me\//.test(text);
  var t = table_(S_LIST);
  if (findIn_(t, 'msg_id', String(m.message_id))) return;
  var type = /#کارجو|#رزومه|#جویای_کار/.test(text) ? 'jobseeker' : ((/#استخدام/.test(text) || (/استخدام|نیازمند|دعوت به همکاری/.test(text) &amp;&amp; hasContact)) ? 'employer' : '');
  if (!type) return;
  var it = newItem_({type:type, title:titleFromText_(text), text:text, status:'approved', public:'بله', msg_id:String(m.message_id), src:'channel'});
  notifyAdminsInfo_('📢 ' + (type === 'employer' ? 'آگهی' : 'رزومه') + ' در کانال شناسایی شد\n' + (it.title || '') + '\nhttps://t.me/' + CHANNEL.replace('@', '') + '/' + m.message_id, 'channel');
  afterPublished_(it);
}

/* =========================== سازگاری با نسخه‌ی قبلی =========================== */
function legacyList_(admin) {
  var out = [];
  table_(S_LIST).rows.forEach(function(r){
    if (!r.id || r.id === 'id') return;
    if (r.type === 'membership') { out.push({id:r.id, type:'membership', title:'', text:'', public:r.public, deleted:r.deleted}); return; }
    var st = r.status || '';
    if (!admin &amp;&amp; st !== 'approved' &amp;&amp; st !== '') return;
    var it = {id:r.id, type:r.type, title:r.title, text:r.text, public:r.public, deleted:r.deleted};
    if (admin &amp;&amp; (st === 'private' || st === 'direct' || st === 'rejected')) return; // نسخه‌ی قدیمی پنل نباید رزومه‌ی خصوصی را منتشر کند
    if (admin) it.status = st;
    out.push(it);
  });
  return out;
}

function legacySave_(d) {
  var admin = d.key === ADMIN_KEY;
  if (d.type === 'membership') {
    if (d.public === 'تأیید') { if (!admin) return {ok:false, error:'key'}; return locked_(function(){ return approveUser_(d.id, 'پنل'); }); }
    return locked_(function(){
      var mobile = normMobile_(d.id) || normMobile_(d.text);
      if (!mobile) return {ok:false, error:'mobile'};
      var t = table_(S_USERS), u = findIn_(t, 'mobile', mobile), isNew = !u;
      if (!u) u = {mobile:mobile, created:now_(), status:'pending', role:'', link_code:rand_(10)};
      if (d.title &amp;&amp; d.title !== 'تأیید') u.name = clean_(d.title, 60);
      save_(t, u); legacyMemberRow_(u);
      if (isNew) notifyAdminsUser_(u, true);
      return {ok:true};
    });
  }
  if (!admin) return {ok:false, error:'key'};
  return API.a_add(d);
}

function legacyForm_(d) {
  return locked_(function(){
    if (d.type === 'membership') return legacySave_({type:'membership', id:d.contact || d.mobile, title:d.name || d.title, text:d.text});
    var text = clean_(d.text, 4000, true);
    if (text.length &lt; 10) return {ok:false, error:'text'};
    var mobile = normMobile_(d.contact || ''), owner = mobile ? find_(S_USERS, 'mobile', mobile) : null;
    var vis = d.type === 'employer' || d.public === 'بله' ? 'channel' : 'admin';
    var it = newItem_({type:d.type, title:clean_(d.title || d.name, 120), text:text, owner:owner ? owner.mobile : '', status:vis === 'channel' ? 'pending' : 'private',
      vis:vis, public:vis === 'channel' ? 'بله' : '', tags:clean_(d.tags, 300), city:clean_(d.city, 60), src:'form-v1', data:JSON.stringify(d).slice(0, 20000)});
    rawLog_(d.type, it, d.contact);
    if (it.status === 'pending') notifyAdminsItem_(it, owner); else notifyAdminsInfo_('📥 رزومه فقط برای ادمین\n' + itemSummary_(it, owner), 'private');
    return {ok:true, id:it.id};
  });
}

function legacyMemberRow_(u) {
  var t = table_(S_LIST), row = null;
  t.rows.forEach(function(r){ if (r.type === 'membership' &amp;&amp; normMobile_(r.id) === u.mobile &amp;&amp; r.deleted !== 'بله') { if (!row) row = r; else { r.deleted = 'بله'; save_(t, r); } } });
  if (!row) row = {id:u.mobile, type:'membership', created:now_(), status:'approved'};
  row.title = u.name || ''; row.text = (u.name || '') + ' ' + u.mobile;
  row.public = u.status === 'approved' ? 'تأیید' : 'در انتظار';
  row.deleted = (u.status === 'rejected' || u.status === 'blocked') ? 'بله' : '';
  row.updated = now_();
  save_(t, row);
}

function rawLog_(type, it, contact) {
  var tabs = {employer:'کارفرما', jobseeker:'کارجو'};
  var sh = rawSheet_(tabs[type] || 'کارفرما', ['تاریخ','نوع','عنوان','متن','تماس','اجازه']);
  sh.appendRow([now_(), type, it.title, it.text, contact || '', it.vis || ''].map(cell_));
}
function rawSheet_(name, headers) {
  var ss = SpreadsheetApp.getActive(), sh = ss.getSheetByName(name);
  if (!sh) sh = ss.insertSheet(name);
  if (!sh.getLastRow()) sh.appendRow(headers);

}

/* =========================== پنل ادمین =========================== */
function adminList_() {
  var users = table_(S_USERS).rows.map(function(u){ return {mobile:u.mobile, name:u.name, role:u.role, status:u.status, created:u.created,
    approved_at:u.approved_at, reason:u.reason || '', tg:!!u.tg_chat, tg_user:u.tg_user, verified:!!u.verified, city:u.city, interests:u.interests, last_seen:u.last_seen, admin:isAdminUser_(u)}; }).reverse();
  var byMobile = {}; users.forEach(function(u){ byMobile[u.mobile] = u; });
  var items = table_(S_LIST).rows.filter(function(r){ return r.id &amp;&amp; r.id !== 'id' &amp;&amp; r.type !== 'membership' &amp;&amp; r.deleted !== 'بله'; })
    .map(function(r){ var o = byMobile[r.owner]; return {id:r.id, type:r.type, title:r.title, text:r.text, status:r.status || 'approved', vis:r.vis, target:r.target,
      msg_id:r.msg_id, cat:r.cat, city:r.city, created:r.created, updated:r.updated, src:r.src, reason:r.reason || '', owner:r.owner, ownerName:o ? o.name : ''}; }).reverse();
  var notifs = table_(S_NOTIF).rows.filter(function(n){ return n.to === 'admin'; }).slice(-40).reverse();
  var st = stats_(table_(S_USERS).rows, table_(S_LIST).rows);
  var ads = admins_().map(function(a){ return {name:a.name, username:a.username}; });
  var p = PropertiesService.getScriptProperties();
  if (!p.getProperty('ADMIN_LINK')) p.setProperty('ADMIN_LINK', rand_(12));
  return {ok:true, users:users, items:items, notifs:notifs, admins:ads, adminPeople:adminPeople_(), adminLink:botLink_('adm_' + p.getProperty('ADMIN_LINK')),
    trigger:!!p.getProperty('SETUP_AT'), v:API_VERSION, features:FEATURES, stats:st};
}
/** ادمین بودن یا با رمز پنل (ADMIN_KEY) یا با توکن کاربری که ادمین است. رمز فقط سمت سرور می‌ماند. */
function isAdmin_(d) {
  if (!d) return false;
  if (d.key === ADMIN_KEY) return true;
  var u = auth_(d);
  return !!(u &amp;&amp; isAdminUser_(u));
}
var _AM = null;
function adminMobiles_() {
  if (_AM) return _AM;
  var raw = PropertiesService.getScriptProperties().getProperty('ADMIN_MOBILES') || '', out = OWNER_MOBILES.slice();
  raw.split(',').forEach(function(m){ m = normMobile_(m); if (m &amp;&amp; out.indexOf(m) &lt; 0) out.push(m); });
  return (_AM = out);
}
/** کاربر ادمین است اگر: چت تلگرامش در «ادمین‌ها» ثبت است؛ یا موبایلش در فهرست ادمین‌هاست.
 *  امنیت: مالک (آرمین) باید تأییدشده باشد؛ بقیه باید تأییدشده و «شماره‌ی تأییدشده با تلگرام» باشند تا کسی با ثبت‌نام شماره‌ی ادمین، ادمین نشود. */
function isAdminUser_(u) {
  if (!u || u.status === 'blocked') return false;
  if (u.tg_chat &amp;&amp; isAdminChat_(u.tg_chat)) return true;
  if (u.status !== 'approved') return false;
  if (OWNER_MOBILES.indexOf(u.mobile) &gt;= 0) return true;
  return adminMobiles_().indexOf(u.mobile) &gt;= 0 &amp;&amp; !!u.verified;
}
function setAdminMobile_(mobile, on) {
  var m = normMobile_(mobile); if (!m) return {ok:false, error:'mobile'};
  if (!on &amp;&amp; OWNER_MOBILES.indexOf(m) &gt;= 0) return {ok:false, error:'owner'};
  var p = PropertiesService.getScriptProperties(), list = adminMobiles_().filter(function(x){ return OWNER_MOBILES.indexOf(x) &lt; 0 &amp;&amp; x !== m; });
  if (on &amp;&amp; OWNER_MOBILES.indexOf(m) &lt; 0) list.push(m);
  p.setProperty('ADMIN_MOBILES', list.join(','));
  _AM = null;
  var u = find_(S_USERS, 'mobile', m);
  if (on &amp;&amp; u) notify_(u, 'admin_role', 'تو ادمین تخصص‌یاب شدی', 'از بخش «حساب من» به پنل ادمین و تنظیمات اعلان دسترسی داری.', '', {url:SITE + '/admin.html', urlText:'پنل ادمین'});
  return {ok:true, admins:adminPeople_(), registered:!!u, verified:!!(u &amp;&amp; u.verified)};
}
function adminPeople_() {
  return adminMobiles_().map(function(m){ var u = find_(S_USERS, 'mobile', m); return {mobile:m, name:u ? u.name : '', owner:OWNER_MOBILES.indexOf(m) &gt;= 0, registered:!!u, verified:!!(u &amp;&amp; u.verified), active:!!(u &amp;&amp; isAdminUser_(u))}; });
}

/* =========================== v2.1: دلیل رد، ویرایش، عملیات گروهی، پیش‌نمایش، همگام‌سازی =========================== */
function normText_(s) {
  return toEn_(String(s || '')).replace(/ي/g, 'ی').replace(/ك/g, 'ک').replace(/[\u200c\u200d\u064B-\u0652\u0640]/g, '').replace(/\s+/g, ' ').trim().toLowerCase();
}
function ms_(s) { var n = new Date(String(s || '').replace(' ', 'T') + '+03:30').getTime(); return isNaN(n) ? 0 : n; }

/** همان فرستنده + همان متن (نرمال‌شده) در ۲۴ ساعت گذشته ← ردیف موجود برگردانده می‌شود (ثبت دوباره نمی‌خورد). */
function dupOf_(owner, type, target, text) {
  var key = normText_(text), cutoff = fmtDate_(new Date(new Date().getTime() - 86400000)), rows = table_(S_LIST).rows;
  for (var i = rows.length - 1; i &gt;= 0; i--) {
    var r = rows[i];
    if (r.owner !== owner || r.type !== type || r.deleted === 'بله' || String(r.created || '') &lt; cutoff) continue;
    if (String(r.target || '') !== String(target || '')) continue;
    if (normText_(r.text) === key) return r;
  }
  return null;
}

function editChannel_(msgId, text) {
  var j = tg_('editMessageText', {chat_id:CHANNEL, message_id:Number(msgId), text:String(text).slice(0, 4000), disable_web_page_preview:true});
  if (j &amp;&amp; !j.ok &amp;&amp; /not modified/i.test(String(j.description || ''))) return {ok:true, same:true};
  return j || {ok:false};
}

function editItem_(d, actor) {
  var t = table_(S_LIST), it = findIn_(t, 'id', d.id);
  if (!it) return {ok:false, error:'notfound'};
  if (it.type === 'membership') return {ok:false, error:'type'};
  if (it.deleted === 'بله') return {ok:false, error:'deleted'};
  var changed = [];
  if (d.title != null) { var ti = clean_(d.title, 120); if (ti !== it.title) { it.title = ti; changed.push('title'); } }
  if (d.text != null) {
    var tx = clean_(d.text, 4000, true);
    if (tx.length &lt; 10) return {ok:false, error:'text'};
    if (tx !== it.text) { it.text = tx; changed.push('text'); }
  }
  if (d.city != null) { var ci = clean_(d.city, 60); if (ci !== it.city) { it.city = ci; changed.push('city'); } }
  if (d.cat != null) { var ca = normCats_(String(d.cat)).join(' '); if (ca !== it.cat) { it.cat = ca; changed.push('cat'); } }
  else if (changed.indexOf('text') &gt;= 0) { it.cat = normCats_((it.tags || '') + ' ' + it.text).join(' '); }
  if (!changed.length) return {ok:true, unchanged:true};
  it.updated = now_(); save_(t, it);
  var channel = null;
  if (it.msg_id &amp;&amp; it.status === 'approved') { var r = editChannel_(it.msg_id, itemPostText_(it)); channel = !!(r &amp;&amp; r.ok); }
  if (it.status === 'pending' &amp;&amp; it.tg) editAdminMsgs_(it.tg, adminItemText_(it) + '\n\n✏️ ویرایش شد · ' + actor,
    {inline_keyboard:[[{text:'✅ انتشار در کانال', callback_data:'i:a:' + it.id}, {text:'❌ رد', callback_data:'i:r:' + it.id}]]});
  var owner = it.owner ? find_(S_USERS, 'mobile', it.owner) : null;
  if (owner) notify_(owner, 'edited', (it.type === 'employer' ? 'آگهی' : 'رزومه') + ' شما ویرایش شد', 'ادمین متن «' + (it.title || '') + '» را اصلاح کرد' + (channel ? ' و پست کانال هم به‌روز شد.' : '.'), it.id, {noDm:true});
  saveAdminNotif_('info', '✏️ ویرایش ' + (it.type === 'employer' ? 'آگهی' : 'رزومه') + ' توسط ' + actor, (it.title || '') + ' · ' + changed.join('، '), it.id);
  Logger.log('ویرایش ' + it.id + ' توسط ' + actor + ': ' + changed.join(','));
  cacheDrop_();
  return {ok:true, id:it.id, changed:changed, channel:channel, item:{id:it.id, title:it.title, text:it.text, cat:it.cat, city:it.city}};
}

function bulk_(d) {
  var op = d.op === 'reject' ? 'reject' : (d.op === 'approve' ? 'approve' : '');
  if (!op) return {ok:false, error:'op'};
  var us = (d.users instanceof Array ? d.users : []).slice(0, 200), its = (d.items instanceof Array ? d.items : []).slice(0, 200);
  if (us.length + its.length &gt; 30) return {ok:false, error:'limit'};
  var results = [], done = 0, reason = clean_(d.reason, 200);
  us.forEach(function(m){
    var r; try { r = op === 'approve' ? approveUser_(m, 'پنل · گروهی') : rejectUser_(m, 'پنل · گروهی', 'rejected', reason); } catch (e) { r = {ok:false, error:'server'}; }
    if (r.ok) done++; results.push({t:'u', id:m, ok:!!r.ok, error:r.ok ? '' : (r.error || '')});
  });
  its.forEach(function(id){
    var r; try { r = op === 'approve' ? approveItem_(id, 'پنل · گروهی') : rejectItem_(id, 'پنل · گروهی', reason); } catch (e) { r = {ok:false, error:'server'}; }
    if (r.ok) done++; results.push({t:'i', id:id, ok:!!r.ok, error:r.ok ? '' : (r.error || '')});
  });
  return {ok:true, done:done, failed:results.length - done, results:results};
}

/** متنی که دقیقاً در کانال گذاشته می‌شود. با d.text می‌شود ویرایشِ ذخیره‌نشده را هم دید. */
function preview_(d) {
  var it = d.id ? find_(S_LIST, 'id', d.id) : null;
  if (d.id &amp;&amp; !it) return {ok:false, error:'notfound'};
  var o = it ? {type:it.type, owner:it.owner, id:it.id, text:it.text} : {type:d.type === 'jobseeker' ? 'jobseeker' : 'employer', owner:d.owner || '', id:'PREVIEW', text:''};
  if (d.text != null) o.text = String(d.text).slice(0, 20000);
  var text = itemPostText_(o);
  return {ok:true, text:text, chars:text.length, over:text.length &gt; 4000, link:text.indexOf('/jobs.html?id=') &gt;= 0 &amp;&amp; o.text.indexOf('takhassosyab.ir') &lt; 0,
    channel:CHANNEL, posted:!!(it &amp;&amp; it.msg_id &amp;&amp; it.status === 'approved')};
}

/* ----- کاربر: ویرایش، بستن، تمدید ----- */
function myItem_(d) {
  var u = auth_(d); if (!u) return {err:{ok:false, error:'auth'}};
  var t = table_(S_LIST), it = findIn_(t, 'id', d.id);
  if (!it || it.owner !== u.mobile || (it.type !== 'employer' &amp;&amp; it.type !== 'jobseeker')) return {err:{ok:false, error:'notfound'}};
  if (u.status === 'blocked') return {err:{ok:false, error:'status'}};
  return {u:u, t:t, it:it};
}
function myEdit_(d) {
  var c = myItem_(d); if (c.err) return c.err;
  var it = c.it, t = c.t, u = c.u;
  if (['pending', 'approved', 'closed', 'private', 'rejected'].indexOf(it.status) &lt; 0) return {ok:false, error:'status'};
  var text = clean_(d.text != null ? d.text : it.text, 4000, true);
  if (text.length &lt; 20) return {ok:false, error:'text'};
  if (d.title != null) it.title = clean_(d.title, 120);
  it.text = text;
  if (d.tags != null) it.tags = clean_(d.tags, 300);
  if (d.city != null) it.city = clean_(d.city, 60);
  it.cat = normCats_((it.tags || '') + ' ' + (d.cat || '') + ' ' + text).join(' ');
  if (d.fields &amp;&amp; typeof d.fields === 'object') it.data = JSON.stringify(d.fields).slice(0, 20000);
  it.status = it.status === 'private' ? 'private' : 'pending';
  it.deleted = ''; it.reason = ''; it.updated = now_();
  save_(t, it); cacheDrop_();
  if (it.status === 'pending') notifyAdminsItem_(it, u);
  else notifyAdminsInfo_('✏️ رزومه‌ی ویرایش‌شده (فقط برای ادمین)\n' + itemSummary_(it, u), 'private');
  return {ok:true, id:it.id, status:it.status};
}
function myClose_(d, close) {
  var c = myItem_(d); if (c.err) return c.err;
  var it = c.it, t = c.t, u = c.u;
  if (close) {
    if (['approved', 'pending', 'private'].indexOf(it.status) &lt; 0) return {ok:false, error:'status'};
    var hired = !!d.hired;
    it.status = 'closed'; it.reason = hired ? 'hired' : 'closed'; it.updated = now_(); save_(t, it);
    if (it.msg_id) editChannel_(it.msg_id, (hired ? '✅ این آگهی تکمیل شد (استخدام انجام شد)' : '🔒 این آگهی بسته شد') + '\n\n' + itemPostText_(it));
    cacheDrop_();
    return {ok:true, status:'closed'};
  }
  if (it.status === 'closed') {
    it.reason = ''; it.updated = now_();
    if (it.msg_id) { it.status = 'approved'; editChannel_(it.msg_id, itemPostText_(it)); save_(t, it); cacheDrop_(); return {ok:true, status:'approved'}; }
    it.status = 'pending'; save_(t, it); notifyAdminsItem_(it, u);
    return {ok:true, status:'pending'};
  }
  if (it.status === 'approved') { it.updated = now_(); save_(t, it); cacheDrop_(); return {ok:true, status:'approved', renewed:true}; }
  return {ok:false, error:'status'};
}

function stats_(users, rows) {

/* =========================== نصب / مهاجرت =========================== */
/** یک بار Run کن. شیت‌ها را می‌سازد، داده‌های قبلی را منتقل می‌کند و تریگر دقیقه‌ای را نصب می‌کند. */
function setup() {
