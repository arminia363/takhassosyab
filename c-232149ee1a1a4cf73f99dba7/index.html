/* =========================== HTTP =========================== */
function doGet(e) {
  var p = (e &amp;&amp; e.parameter) || {};
  try {
    if (p.action === &#x27;list&#x27;) return json_({ok:true, items:legacyList_(false)});
    if (p.action === &#x27;admin&#x27;) {
      if (p.key !== ADMIN_KEY) return json_({ok:false, error:&#x27;key&#x27;});
      return json_({ok:true, items:legacyList_(true)});
    }
    if (p.action === &#x27;feed&#x27;) return json_({ok:true, items:feed_()});
    return json_({ok:true, service:&#x27;takhassosyab&#x27;, v:API_VERSION, bot:botName_(), features:features_()});
  } catch (err) { return json_({ok:false, error:&#x27;server&#x27;, detail:String(err)}); }
}

function doPost(e) {
  var d = {};
  try { d = JSON.parse(e.postData.contents); } catch (err) { d = (e &amp;&amp; e.parameter) || {}; }
  try {
    var a = d.action || &#x27;&#x27;;
    if (API[a]) return json_(API[a](d));
    if (a === &#x27;save&#x27;) return json_(legacySave_(d));
    if (a === &#x27;approve&#x27;) { if (d.key !== ADMIN_KEY) return json_({ok:false, error:&#x27;key&#x27;}); return json_(approveItem_(d.id, &#x27;پنل&#x27;)); }
    if (a === &#x27;delete&#x27;) { if (d.key !== ADMIN_KEY) return json_({ok:false, error:&#x27;key&#x27;}); return json_(deleteItem_(d.id, &#x27;پنل&#x27;)); }
    if (d.type === &#x27;employer&#x27; || d.type === &#x27;jobseeker&#x27; || d.type === &#x27;membership&#x27;) return json_(legacyForm_(d));
    return json_({ok:false, error:&#x27;action&#x27;});
  } catch (err) {
    Logger.log(&#x27;خطا: &#x27; + err + &#x27;\n&#x27; + (err &amp;&amp; err.stack));
    return json_({ok:false, error:&#x27;server&#x27;, detail:String(err)});
  }
}

var API = {
  ping: function(){ return {ok:true, v:API_VERSION, bot:botName_(), features:features_()}; },
  feed: function(){ return {ok:true, items:feed_()}; },
  register: function(d){ var ctx = {}, r = locked_(function(){ return register_(d, ctx); }); var s = smsAfter_(ctx); if (s &amp;&amp; r.ok) r.sms = s; else if (r.ok &amp;&amp; r.smsRes) r.sms = r.smsRes; delete r.smsRes; return r; },
  login_start: function(d){ var ctx = {}, r = locked_(function(){ return loginStart_(d, ctx); }); if (!ctx.send) return r; var s = smsAfter_(ctx); if (s.sent) return r; r.ok = false; r.error = &#x27;sms_fail&#x27;; delete r.via; delete r.resend; delete r.ttl; return r; },
  verify_mobile: function(d){ return locked_(function(){ return verifyMobile_(d); }); },
  verify_resend: function(d){ var ctx = {}, r = locked_(function(){ return verifyResend_(d, ctx); }); var s = smsAfter_(ctx); if (s &amp;&amp; r.ok) r.sms = s; else if (r.ok &amp;&amp; r.smsRes) r.sms = r.smsRes; delete r.smsRes; return r; },
  change_mobile: function(d){ var ctx = {}, r = locked_(function(){ return changeMobile_(d, ctx); }); var s = smsAfter_(ctx); if (s &amp;&amp; r.ok) r.sms = s; else if (r.ok &amp;&amp; r.smsRes) r.sms = r.smsRes; delete r.smsRes; return r; },
  a_sms: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; return smsStatus_(); },
  login_verify: function(d){ return locked_(function(){ return loginVerify_(d); }); },
  login_poll: function(d){ pull_(false); return loginPoll_(d); },
  me: function(d){ return me_(d); },
  profile: function(d){ return locked_(function(){ return profile_(d); }); },
  submit: function(d){ return locked_(function(){ return submit_(d); }); },
  my_delete: function(d){ return locked_(function(){
    var u = auth_(d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
    var it = find_(S_LIST, &#x27;id&#x27;, d.id); if (!it || it.owner !== u.mobile) return {ok:false, error:&#x27;notfound&#x27;};

    return deleteItem_(d.id, u.name || u.mobile);
  }); },
  my_edit: function(d){ return locked_(function(){ return myEdit_(d); }); },
  my_close: function(d){ return locked_(function(){ return myClose_(d, true); }); },
  my_renew: function(d){ return locked_(function(){ return myClose_(d, false); }); },
  inbox_state: function(d){ return locked_(function(){ return inboxState_(d); }); },
  saved_sync: function(d){ return locked_(function(){ return savedSync_(d); }); },
  notif_read: function(d){ return locked_(function(){
    var u = auth_(d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
    var t = table_(S_NOTIF), n = 0;
    t.rows.forEach(function(r){ if (r.to === u.mobile &amp;&amp; !r.read) { r.read = &#x27;1&#x27;; save_(t, r); n++; } });
    return {ok:true, n:n};
  }); },
  // ---------- ادمین ----------
  admin_prefs: function(d){ return locked_(function(){

    if (!isAdminUser_(u)) return {ok:false, error:&#x27;key&#x27;};
    if (d.prefs &amp;&amp; typeof d.prefs === &#x27;object&#x27;) {

  a_list: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; pull_(false); return adminList_(); },
  a_user: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; return locked_(function(){
    if ((d.op === &#x27;approve&#x27; || d.op === &#x27;reject&#x27; || d.op === &#x27;block&#x27; || d.op === &#x27;restore&#x27;) &amp;&amp; selfByToken_(d, d.mobile)) return SELF_ERR;
    if (d.op === &#x27;approve&#x27;) return approveUser_(d.mobile, &#x27;پنل&#x27;);
    if (d.op === &#x27;reject&#x27;) return rejectUser_(d.mobile, &#x27;پنل&#x27;, &#x27;rejected&#x27;, d.reason);
    if (d.op === &#x27;block&#x27;) return rejectUser_(d.mobile, &#x27;پنل&#x27;, &#x27;blocked&#x27;, d.reason);
    if (d.op === &#x27;make_admin&#x27; || d.op === &#x27;remove_admin&#x27;) return setAdminMobile_(d.mobile, d.op === &#x27;make_admin&#x27;);
    if (d.op === &#x27;restore&#x27;) { var t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, normMobile_(d.mobile)); if (!u) return {ok:false, error:&#x27;notfound&#x27;}; u.status = &#x27;pending&#x27;; u.reason = &#x27;&#x27;; save_(t, u); return {ok:true}; }
    return {ok:false, error:&#x27;op&#x27;};
  }); },
  a_item: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; return locked_(function(){
    if ((d.op === &#x27;approve&#x27; || d.op === &#x27;reject&#x27;) &amp;&amp; selfByToken_(d, targetMobileOfItem_(d.id))) return SELF_ERR;
    if (d.op === &#x27;approve&#x27;) return approveItem_(d.id, &#x27;پنل&#x27;);
    if (d.op === &#x27;reject&#x27;) return rejectItem_(d.id, &#x27;پنل&#x27;, d.reason);
    if (d.op === &#x27;delete&#x27;) return deleteItem_(d.id, &#x27;پنل&#x27;);
    if (d.op === &#x27;edit&#x27;) return editItem_(d, &#x27;پنل&#x27;);
    return {ok:false, error:&#x27;op&#x27;};
  }); },
  a_bulk: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; return locked_(function(){ return bulk_(d); }); },
  a_preview: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; return locked_(function(){ return preview_(d); }); },
  a_add: function(d){ if (!isAdmin_(d)) return {ok:false, error:&#x27;key&#x27;}; return locked_(function(){
    var it = newItem_({type:d.type === &#x27;jobseeker&#x27; ? &#x27;jobseeker&#x27; : &#x27;employer&#x27;, title:d.title, text:d.text, status:&#x27;approved&#x27;, src:&#x27;admin&#x27;, public:&#x27;بله&#x27;});
    if (d.post) { var r = postToChannel(itemPostText_(it)); if (r.ok) { it.msg_id = String(r.msgId); save_(table_(S_LIST), it); } }
    afterPublished_(it);
    return {ok:true, id:it.id};
  }); }

/* =========================== کاربران =========================== */
function register_(d, ctx) {
  var mobile = normMobile_(d.mobile), name = clean_(d.name, 60), role = d.role === &#x27;employer&#x27; ? &#x27;employer&#x27; : &#x27;jobseeker&#x27;;
  if (!mobile) return {ok:false, error:&#x27;mobile&#x27;};
  if (!name) return {ok:false, error:&#x27;name&#x27;};
  var t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, mobile), isNew = !u;
  if (u &amp;&amp; (u.status === &#x27;blocked&#x27;)) return {ok:false, error:&#x27;blocked&#x27;};
  if (u &amp;&amp; u.status === &#x27;approved&#x27;) return {ok:false, error:&#x27;exists&#x27;, needLogin:true}; // عضو تأییدشده باید با تلگرام وارد شود
  if (!u) u = {mobile:mobile, created:now_(), status:&#x27;pending&#x27;};
  if (u.status === &#x27;rejected&#x27;) { u.status = &#x27;pending&#x27;; u.reason = &#x27;&#x27;; }
  var smsFlow = !!d.sms &amp;&amp; smsOn_() &amp;&amp; !vOk_(u); // فرانت جدید با sms:1 می‌آید؛ فرانت قدیمی مثل قبل بدون تأیید پیامکی ثبت می‌شود
  u.name = name; u.role = role; if (d.city) u.city = clean_(d.city, 40);
  if (!u.link_code) u.link_code = rand_(10);
  var token = rand_(24);
  u.tokens = addToken_(u.tokens, token);
  u.last_seen = now_();
  if (smsFlow &amp;&amp; u.status === &#x27;pending&#x27;) u.verified = &#x27;w&#x27;; // شماره باید اول با پیامک تأیید شود؛ بعدش درخواست به ادمین می‌رسد
  save_(t, u);
  var out = {ok:true, token:token, user:pubUser_(u)};
  if (u.verified === &#x27;w&#x27;) { out.smsRes = smsReply_(smsReserve_(mobile), ctx, mobile); return out; }
  legacyMemberRow_(u);
  if (isNew || u.status === &#x27;pending&#x27;) notifyAdminsUser_(u, isNew);
  return out;
}

/** تأیید شماره‌ی ثبت‌نام با کد پیامکی (کاربر توکن دارد). */
function verifyMobile_(d) {
  var u = auth_(d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
  if (vOk_(u)) return {ok:true, user:pubUser_(u), already:true};
  var r = codeCheck_(u.mobile, toEn_(String(d.code || &#x27;&#x27;)).replace(/\D/g, &#x27;&#x27;));
  if (!r.ok) return r;
  return {ok:true, user:pubUser_(markVerified_(u.mobile))};
}
function verifyResend_(d, ctx) {
  var u = auth_(d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
  if (!smsOn_()) return {ok:false, error:&#x27;nosms&#x27;};
  if (vOk_(u)) return {ok:true, user:pubUser_(u), already:true};
  return {ok:true, smsRes:smsReply_(smsReserve_(u.mobile), ctx, u.mobile)};
}
/** شماره‌ی اشتباه: فقط برای ثبت‌نامِ هنوز تأییدنشده؛ شماره عوض می‌شود و کد تازه می‌رود. */
function changeMobile_(d, ctx) {
  var t = table_(S_USERS), u = authIn_(t, d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
  if (!smsOn_()) return {ok:false, error:&#x27;nosms&#x27;};
  if (u.verified !== &#x27;w&#x27; || u.status !== &#x27;pending&#x27;) return {ok:false, error:&#x27;status&#x27;};
  var m = normMobile_(d.mobile); if (!m) return {ok:false, error:&#x27;mobile&#x27;};
  if (m !== u.mobile) {
    var other = findIn_(t, &#x27;mobile&#x27;, m);
    if (other) return {ok:false, error:&#x27;exists&#x27;, needLogin:other.status === &#x27;approved&#x27;};
    var c = CacheService.getScriptCache(); c.remove(&#x27;sc_&#x27; + u.mobile); c.remove(&#x27;lt_&#x27; + u.mobile);
    u.mobile = m; save_(t, u);
  }
  return {ok:true, user:pubUser_(u), smsRes:smsReply_(smsReserve_(u.mobile), ctx, u.mobile)};
}

function loginStart_(d, ctx) {
  var mobile = normMobile_(d.mobile); if (!mobile) return {ok:false, error:&#x27;mobile&#x27;};
  var u = find_(S_USERS, &#x27;mobile&#x27;, mobile);
  if (!u) return {ok:false, error:&#x27;nouser&#x27;};
  if (u.status === &#x27;blocked&#x27;) return {ok:false, error:&#x27;blocked&#x27;};
  var cache = CacheService.getScriptCache();
  if (d.sms &amp;&amp; d.via !== &#x27;telegram&#x27; &amp;&amp; smsOn_()) { // فرانت جدید: پیش‌فرض پیامک؛ via:&#x27;telegram&#x27; = «ارسال از تلگرام»
    var rs = smsReserve_(mobile);
    if (!rs.ok) return {ok:false, error:rs.error, wait:rs.wait || 0, canTelegram:true};
    ctx.send = {mobile:mobile, code:rs.code};
    return {ok:true, via:&#x27;sms&#x27;, resend:SMS_RESEND, ttl:SMS_TTL, canTelegram:true, tg:!!u.tg_chat};
  }
  if (u.tg_chat) {
    var code = String(Math.floor(10000 + Math.random() * 90000));
    cache.put(&#x27;lc_&#x27; + mobile, code, 600);
    var r = tgSend_(u.tg_chat, &#x27;🔐 کد ورود تخصص‌یاب: &#x27; + code + &#x27;\nاین کد را به کسی نده. اگر درخواست ورود نداده‌ای، این پیام را نادیده بگیر.&#x27;);
    if (r &amp;&amp; r.ok) return {ok:true, via:&#x27;code&#x27;};
  }
  var nonce = rand_(12);
  cache.put(&#x27;ln_&#x27; + nonce, JSON.stringify({mobile:mobile}), 900);
  return {ok:true, via:&#x27;telegram&#x27;, nonce:nonce, link:botLink_(&#x27;G&#x27; + nonce)};
}

function loginVerify_(d) {
  var mobile = normMobile_(d.mobile), code = toEn_(String(d.code || &#x27;&#x27;)).replace(/\D/g, &#x27;&#x27;);
  var r = codeCheck_(mobile, code);
  if (!r.ok) return r;
  if (r.via === &#x27;sms&#x27;) markVerified_(mobile); // ورود با پیامک = اثبات مالکیت شماره
  return issueToken_(mobile);
}

function loginPoll_(d) {
  var cache = CacheService.getScriptCache(), raw = cache.get(&#x27;ln_&#x27; + String(d.nonce || &#x27;&#x27;));
  if (!raw) return {ok:false, error:&#x27;expired&#x27;};
  var o = JSON.parse(raw);
  if (!o.ok) return {ok:true, waiting:true};
  cache.remove(&#x27;ln_&#x27; + d.nonce);
  return locked_(function(){ return issueToken_(o.mobile); });
}

function issueToken_(mobile) {
  var t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, mobile);
  if (!u) return {ok:false, error:&#x27;nouser&#x27;};
  var token = rand_(24); u.tokens = addToken_(u.tokens, token); u.last_seen = now_(); save_(t, u);
  return {ok:true, token:token, user:pubUser_(u)};
}

function me_(d) {
  var u = auth_(d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
  if (!u.tg_chat || u.status === &#x27;pending&#x27;) { pull_(false); u = auth_(d); }
  var notifs = table_(S_NOTIF).rows.filter(function(n){ return n.to === u.mobile; })
    .slice(-60).reverse().map(function(n){ return {id:n.id, kind:n.kind, title:n.title, body:n.body, ref:n.ref, at:n.created, read:!!n.read}; });
  var items = table_(S_LIST).rows, mine = [], myAds = {}, inbox = [];
  items.forEach(function(it){
    if (it.owner !== u.mobile || it.deleted === &#x27;بله&#x27;) return;
    if (it.type === &#x27;employer&#x27;) myAds[it.id] = it.title;
  });
  items.forEach(function(it){
    if (it.owner !== u.mobile || it.type === &#x27;membership&#x27;) return;
    var gone = it.deleted === &#x27;بله&#x27;;
    if (gone &amp;&amp; it.status !== &#x27;rejected&#x27;) return; // رد‌شده‌ها برای نمایش دلیل می‌مانند تا کاربر خودش حذف کند
    var tg = it.target ? find_(S_LIST, &#x27;id&#x27;, it.target) : null;
    var dj = String(it.data || &#x27;&#x27;).length &lt;= 8000 ? parseJ_(it.data, null) : null;
    mine.push({id:it.id, type:it.type, title:it.title, status:it.status, vis:it.vis, created:it.created, updated:it.updated, text:it.text, cat:it.cat, city:it.city,
      tags:it.tags, data:dj, target:it.target, targetTitle:tg ? tg.title : &#x27;&#x27;, reason:(it.status === &#x27;rejected&#x27; || it.status === &#x27;closed&#x27;) ? it.reason : &#x27;&#x27;, msg:it.msg_id || &#x27;&#x27;});
  });
  var st = userState_(u);
  items.forEach(function(it){
    if (it.vis === &#x27;direct&#x27; &amp;&amp; myAds[it.target] &amp;&amp; it.deleted !== &#x27;بله&#x27;)
      inbox.push({id:it.id, title:it.title, text:it.text, cat:it.cat, city:it.city, created:it.created, ad:it.target, adTitle:myAds[it.target], state:st.inbox[it.id] || &#x27;&#x27;});
  });
  var adm = isAdminUser_(u);
  return {ok:true, user:pubUser_(u), adminPrefs:adm ? prefsOf_(u) : undefined, notifs:notifs, unread:notifs.filter(function(n){return !n.read;}).length,
    mine:mine.reverse(), inbox:inbox.reverse(), saved:st.saved, features:features_(), bot:botName_(), group:u.status === &#x27;approved&#x27; ? GROUP_LINK : &#x27;&#x27;};
}

function profile_(d) {
  var t = table_(S_USERS), u = authIn_(t, d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
  if (d.name) u.name = clean_(d.name, 60);
  if (d.city != null) u.city = clean_(d.city, 40);
  if (d.role === &#x27;employer&#x27; || d.role === &#x27;jobseeker&#x27;) u.role = d.role;
  if (d.interests != null) u.interests = normCats_(String(d.interests)).join(&#x27; &#x27;);
  if (d.logout) u.tokens = String(u.tokens || &#x27;&#x27;).split(&#x27; &#x27;).filter(function(x){ return x &amp;&amp; x !== d.token; }).join(&#x27; &#x27;);
  save_(t, u);
  return {ok:true, user:pubUser_(u)};
}

function approveUser_(mobile, actor) {
  mobile = normMobile_(mobile);
  var t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, mobile);
  if (!u) return {ok:false, error:&#x27;notfound&#x27;};
  if (u.status === &#x27;approved&#x27;) return {ok:true, already:true, invite:u.invite};
  u.status = &#x27;approved&#x27;; u.approved_at = now_();
  if (!u.invite) u.invite = createInvite_(u);
  save_(t, u);
  legacyMemberRow_(u);
  var body = &#x27;به تخصص‌یاب خوش آمدی. حالا به همه‌ی آگهی‌ها و رزومه‌ها دسترسی داری.\nلینک ورود به کانال: &#x27; + u.invite + &#x27;\nگروه گفتگو: &#x27; + GROUP_LINK;
  notify_(u, &#x27;approved&#x27;, &#x27;عضویت شما تأیید شد&#x27;, body, &#x27;&#x27;, {url:SITE + &#x27;/enter.html&#x27;, urlText:&#x27;ورود به برنامه&#x27;});
  editAdminMsgs_(u.tg, adminUserText_(u) + &#x27;\n\n✅ تأیید شد · &#x27; + actor);
  u.tg = &#x27;&#x27;; save_(t, u);
  return {ok:true, invite:u.invite};
}

function rejectUser_(mobile, actor, status, reason) {
  mobile = normMobile_(mobile);
  var t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, mobile);
  if (!u) return {ok:false, error:&#x27;notfound&#x27;};
  if (u.status === (status || &#x27;rejected&#x27;)) return {ok:true, already:true};
  reason = clean_(reason, 200);
  u.status = status || &#x27;rejected&#x27;; u.reason = reason; save_(t, u);
  legacyMemberRow_(u);
  if (status !== &#x27;blocked&#x27;) notify_(u, &#x27;rejected&#x27;, &#x27;درخواست عضویت تأیید نشد&#x27;, (reason ? &#x27;دلیل: &#x27; + reason + &#x27;\n&#x27; : &#x27;&#x27;) + &#x27;می‌توانی اطلاعاتت را اصلاح و دوباره درخواست بدهی. اگر فکر می‌کنی اشتباه شده، به ادمین پیام بده: @arminia363&#x27;, &#x27;&#x27;);
  editAdminMsgs_(u.tg, adminUserText_(u) + &#x27;\n\n❌ &#x27; + (status === &#x27;blocked&#x27; ? &#x27;مسدود شد&#x27; : &#x27;رد شد&#x27;) + &#x27; · &#x27; + actor + (reason ? &#x27;\nدلیل: &#x27; + reason : &#x27;&#x27;));
  // فقط مسدودسازی ردپای پیام‌های ادمین را پاک می‌کند؛ رد شدن اتصال تلگرام و پیام‌ها را نگه می‌دارد تا «درخواست دوباره» کار کند
  if (status === &#x27;blocked&#x27;) { u.tg = &#x27;&#x27;; save_(t, u); }
  return {ok:true};
}

function createInvite_(u) {
  var r = tg_(&#x27;createChatInviteLink&#x27;, {chat_id:CHANNEL, member_limit:1, name:(&#x27;عضو &#x27; + u.mobile.slice(-4))});
  if (r &amp;&amp; r.ok &amp;&amp; r.result &amp;&amp; r.result.invite_link) return r.result.invite_link;
  return &#x27;https://t.me/&#x27; + CHANNEL.replace(&#x27;@&#x27;, &#x27;&#x27;);
}

/* =========================== آگهی و رزومه =========================== */
function submit_(d) {
  var t = table_(S_USERS), u = authIn_(t, d); if (!u) return {ok:false, error:&#x27;auth&#x27;};
  if (u.status === &#x27;blocked&#x27; || u.status === &#x27;rejected&#x27;) return {ok:false, error:&#x27;status&#x27;};
  var type = d.type === &#x27;jobseeker&#x27; ? &#x27;jobseeker&#x27; : &#x27;employer&#x27;;
  var text = clean_(d.text, 4000, true);
  if (text.length &lt; 20) return {ok:false, error:&#x27;text&#x27;};
  var dupId = dupOf_(u.mobile, type, d.type === &#x27;jobseeker&#x27; &amp;&amp; d.vis === &#x27;direct&#x27; ? String(d.target || &#x27;&#x27;) : &#x27;&#x27;, text);
  if (dupId) return {ok:true, dup:true, id:dupId.id, status:dupId.status};
  var cache = CacheService.getScriptCache(), rk = &#x27;rs_&#x27; + u.mobile, cnt = Number(cache.get(rk) || 0);
  if (cnt &gt;= 15) return {ok:false, error:&#x27;rate&#x27;};
  cache.put(rk, String(cnt + 1), 21600);
  var vis = type === &#x27;employer&#x27; ? &#x27;channel&#x27; : ([&#x27;channel&#x27;,&#x27;admin&#x27;,&#x27;direct&#x27;].indexOf(d.vis) &gt;= 0 ? d.vis : &#x27;channel&#x27;);
  var target = &#x27;&#x27;;
  if (vis === &#x27;direct&#x27;) {
    var ad = find_(S_LIST, &#x27;id&#x27;, d.target);
    if (!ad || ad.type !== &#x27;employer&#x27; || ad.deleted === &#x27;بله&#x27;) return {ok:false, error:&#x27;target&#x27;};
    target = ad.id;
  }
  var status = vis === &#x27;channel&#x27; ? &#x27;pending&#x27; : (vis === &#x27;admin&#x27; ? &#x27;private&#x27; : &#x27;direct&#x27;);
  var cats = normCats_((d.tags || &#x27;&#x27;) + &#x27; &#x27; + (d.cat || &#x27;&#x27;) + &#x27; &#x27; + text);
  var it = newItem_({type:type, title:clean_(d.title || d.name, 120), text:text, owner:u.mobile, status:status, vis:vis, target:target,
    public:(vis === &#x27;channel&#x27; ? &#x27;بله&#x27; : &#x27;&#x27;), cat:cats.join(&#x27; &#x27;), city:clean_(d.city, 60), tags:clean_(d.tags, 300), src:&#x27;app&#x27;,
    data:JSON.stringify(d.fields || {}).slice(0, 20000)});
  rawLog_(type, it, d.contact);
  // علاقه‌مندی کاربر برای تطبیق
  if (cats.length) { u.interests = normCats_((u.interests || &#x27;&#x27;) + &#x27; &#x27; + cats.join(&#x27; &#x27;)).join(&#x27; &#x27;); if (!u.city &amp;&amp; it.city) u.city = it.city; save_(t, u); }
  if (status === &#x27;pending&#x27;) notifyAdminsItem_(it, u);
  else if (status === &#x27;private&#x27;) notifyAdminsInfo_(&#x27;📥 رزومه فقط برای ادمین\n&#x27; + itemSummary_(it, u), &#x27;private&#x27;);
  else deliverDirect_(it, u);
  return {ok:true, id:it.id, status:status};
}

function deliverDirect_(it, u) {
  var ad = find_(S_LIST, &#x27;id&#x27;, it.target);
  var owner = ad &amp;&amp; ad.owner ? find_(S_USERS, &#x27;mobile&#x27;, ad.owner) : null;
  if (owner) {
    notify_(owner, &#x27;resume_direct&#x27;, &#x27;رزومه برای آگهی «&#x27; + (ad.title || &#x27;شما&#x27;) + &#x27;»&#x27;, (it.title || &#x27;رزومه&#x27;) + &#x27;\n\n&#x27; + it.text, it.id,
      {url:SITE + &#x27;/inbox.html&#x27;, urlText:&#x27;مشاهده در برنامه&#x27;, full:true});
    notify_(u, &#x27;sent&#x27;, &#x27;رزومه‌ات برای کارفرما ارسال شد&#x27;, &#x27;آگهی: &#x27; + (ad.title || &#x27;&#x27;), it.id, {noDm:true});
    notifyAdminsInfo_(&#x27;📨 رزومه‌ی مستقیم برای «&#x27; + (ad.title || &#x27;&#x27;) + &#x27;»\n&#x27; + itemSummary_(it, u), &#x27;direct&#x27;);
  } else {
    notify_(u, &#x27;sent&#x27;, &#x27;رزومه‌ات ارسال شد&#x27;, &#x27;این آگهی از کانال آمده؛ رزومه‌ات را ادمین به کارفرما می‌رساند.&#x27;, it.id, {noDm:true});
    notifyAdminsInfo_(&#x27;📨 رزومه برای آگهی «&#x27; + (ad ? ad.title : &#x27;&#x27;) + &#x27;» (صاحب آگهی در برنامه نیست؛ لطفاً دستی برسان)\n&#x27; + itemSummary_(it, u) + &#x27;\n\n&#x27; + it.text);
  }
}

function approveItem_(id, actor) {
  var t = table_(S_LIST), it = findIn_(t, &#x27;id&#x27;, id);
  if (!it) return {ok:false, error:&#x27;notfound&#x27;};
  if (it.deleted === &#x27;بله&#x27;) return {ok:false, error:&#x27;deleted&#x27;};
  if (it.type === &#x27;membership&#x27;) return approveUser_(it.id, actor);
  if (it.status === &#x27;approved&#x27; &amp;&amp; it.msg_id) return {ok:true, already:true, msgId:it.msg_id};
  var res;
  if (it.msg_id &amp;&amp; it.status !== &#x27;approved&#x27;) { // ویرایش‌شده‌ی منتشرشده: همان پست کانال به‌روز می‌شود، پست تازه نمی‌سازیم
    var er = editChannel_(it.msg_id, itemPostText_(it));
    res = er.ok ? {ok:true, msgId:it.msg_id} : postToChannel(itemPostText_(it));
  } else res = postToChannel(itemPostText_(it));
  if (!res.ok) return {ok:false, error:&#x27;telegram&#x27;, detail:res.detail};
  it.reason = &#x27;&#x27;;
  it.status = &#x27;approved&#x27;; it.msg_id = String(res.msgId); it.public = &#x27;بله&#x27;; if (it.vis !== &#x27;channel&#x27; &amp;&amp; it.type === &#x27;jobseeker&#x27;) it.vis = &#x27;channel&#x27;;
  it.updated = now_(); save_(t, it);
  editAdminMsgs_(it.tg, adminItemText_(it) + &#x27;\n\n✅ منتشر شد · &#x27; + actor);
  it.tg = &#x27;&#x27;; save_(t, it);
  var owner = it.owner ? find_(S_USERS, &#x27;mobile&#x27;, it.owner) : null;
  if (owner) notify_(owner, &#x27;published&#x27;, it.type === &#x27;employer&#x27; ? &#x27;آگهی شما منتشر شد&#x27; : &#x27;رزومه شما منتشر شد&#x27;,
    &#x27;«&#x27; + (it.title || &#x27;&#x27;) + &#x27;» حالا در کانال @JobVacencies و برنامه دیده می‌شود.&#x27;, it.id, {url:&#x27;https://t.me/&#x27; + CHANNEL.replace(&#x27;@&#x27;,&#x27;&#x27;) + &#x27;/&#x27; + it.msg_id, urlText:&#x27;دیدن در کانال&#x27;});
  afterPublished_(it);
  return {ok:true, msgId:res.msgId};
}

function rejectItem_(id, actor, reason) {
  var t = table_(S_LIST), it = findIn_(t, &#x27;id&#x27;, id);
  if (!it) return {ok:false, error:&#x27;notfound&#x27;};
  if (it.status === &#x27;rejected&#x27; &amp;&amp; it.deleted === &#x27;بله&#x27;) return {ok:true, already:true};
  reason = clean_(reason, 200);
  it.status = &#x27;rejected&#x27;; it.deleted = &#x27;بله&#x27;; it.reason = reason; it.updated = now_(); save_(t, it);
  if (it.msg_id) deleteFromChannel(it.msg_id);
  editAdminMsgs_(it.tg, adminItemText_(it) + &#x27;\n\n❌ رد شد · &#x27; + actor + (reason ? &#x27;\nدلیل: &#x27; + reason : &#x27;&#x27;));
  it.tg = &#x27;&#x27;; save_(t, it);
  var owner = it.owner ? find_(S_USERS, &#x27;mobile&#x27;, it.owner) : null;
  if (owner) notify_(owner, &#x27;rejected_item&#x27;, (it.type === &#x27;employer&#x27; ? &#x27;آگهی&#x27; : &#x27;رزومه&#x27;) + &#x27; شما تأیید نشد&#x27;,
    &#x27;«&#x27; + (it.title || &#x27;&#x27;) + &#x27;» منتشر نشد.&#x27; + (reason ? &#x27;\nدلیل: &#x27; + reason : &#x27;&#x27;) + &#x27;\nمی‌توانی آن را از «ارسال‌های من» ویرایش و دوباره بفرستی. برای جزئیات به ادمین پیام بده: @arminia363&#x27;, it.id);
  cacheDrop_();
  return {ok:true};
}

function deleteItem_(id, actor) {
  var t = table_(S_LIST), hit = false;
  t.rows.forEach(function(it){
    if (String(it.id) !== String(id)) return;
    hit = true;
    if (it.type === &#x27;membership&#x27; &amp;&amp; it.deleted !== &#x27;بله&#x27;) { var u = find_(S_USERS, &#x27;mobile&#x27;, normMobile_(it.id)); if (u &amp;&amp; u.status === &#x27;pending&#x27;) rejectUser_(u.mobile, actor, &#x27;rejected&#x27;); }
    it.deleted = &#x27;بله&#x27;; it.updated = now_();
    if (it.msg_id) { deleteFromChannel(it.msg_id); }
    if (it.tg) { editAdminMsgs_(it.tg, adminItemText_(it) + &#x27;\n\n🗑 حذف شد · &#x27; + actor); it.tg = &#x27;&#x27;; }
    save_(t, it);
  });
  cacheDrop_();
  return hit ? {ok:true} : {ok:false, error:&#x27;notfound&#x27;};
}

function newItem_(o) {
  var t = table_(S_LIST);
  var it = {id:o.id || uid_(), type:o.type, title:o.title || &#x27;&#x27;, text:o.text || &#x27;&#x27;, public:o.public || &#x27;&#x27;, deleted:&#x27;&#x27;, status:o.status || &#x27;pending&#x27;,
    msg_id:o.msg_id || &#x27;&#x27;, owner:o.owner || &#x27;&#x27;, cat:o.cat || normCats_((o.tags || &#x27;&#x27;) + &#x27; &#x27; + (o.text || &#x27;&#x27;)).join(&#x27; &#x27;), city:o.city || cityOf_(o.text),
    tags:o.tags || &#x27;&#x27;, vis:o.vis || (o.type === &#x27;employer&#x27; ? &#x27;channel&#x27; : &#x27;&#x27;), target:o.target || &#x27;&#x27;, created:now_(), updated:now_(), src:o.src || &#x27;&#x27;, tg:&#x27;&#x27;, data:o.data || &#x27;&#x27;, reason:&#x27;&#x27;};
  save_(t, it);
  cacheDrop_();
  return it;
}

function itemPostText_(it) {
  var txt = String(it.text || &#x27;&#x27;);
  if (it.type === &#x27;employer&#x27; &amp;&amp; it.owner &amp;&amp; txt.indexOf(&#x27;takhassosyab.ir&#x27;) &lt; 0) txt += &#x27;\n\n📩 ارسال رزومه از برنامه: &#x27; + SITE + &#x27;/jobs.html?id=&#x27; + it.id;
  return txt;
}

/* =========================== تطبیق و اعلان =========================== */
function afterPublished_(it) {
  cacheDrop_();
  var cats = String(it.cat || &#x27;&#x27;).split(&#x27; &#x27;).filter(String);
  if (!cats.length) return 0;
  var users = table_(S_USERS).rows, n = 0, sent = {};
  var ads = it.type === &#x27;jobseeker&#x27; ? table_(S_LIST).rows.filter(function(a){ return a.type === &#x27;employer&#x27; &amp;&amp; a.owner &amp;&amp; a.deleted !== &#x27;بله&#x27; &amp;&amp; a.status === &#x27;approved&#x27;; }) : [];
  users.forEach(function(u){
    if (u.status !== &#x27;approved&#x27; || u.mobile === it.owner || sent[u.mobile] || n &gt;= 300) return;
    var match = null;
    if (it.type === &#x27;jobseeker&#x27; &amp;&amp; u.role === &#x27;employer&#x27;) {
      ads.forEach(function(a){ if (!match &amp;&amp; a.owner === u.mobile &amp;&amp; overlap_(a.cat, cats) &amp;&amp; cityOk_(a.city, it.city)) match = a; });
      if (!match &amp;&amp; overlap_(u.interests, cats) &amp;&amp; cityOk_(u.city, it.city)) match = {title:&#x27;&#x27;};
      if (match) {
        sent[u.mobile] = 1; n++;
        notify_(u, &#x27;match&#x27;, &#x27;رزومه‌ی مرتبط&#x27; + (match.title ? &#x27; با آگهی «&#x27; + match.title + &#x27;»&#x27; : &#x27;&#x27;), (it.title || &#x27;رزومه&#x27;) + &#x27;\n&#x27; + firstLines_(it.text, 6), it.id,
          {url:SITE + &#x27;/resumes.html?id=&#x27; + it.id, urlText:&#x27;مشاهده رزومه&#x27;});
      }
    } else if (it.type === &#x27;employer&#x27; &amp;&amp; u.role === &#x27;jobseeker&#x27;) {
      if (overlap_(u.interests, cats) &amp;&amp; cityOk_(u.city, it.city)) {
        sent[u.mobile] = 1; n++;
        notify_(u, &#x27;match&#x27;, &#x27;آگهی مرتبط با تخصص تو&#x27;, (it.title || &#x27;آگهی استخدام&#x27;) + &#x27;\n&#x27; + firstLines_(it.text, 6), it.id,
          {url:SITE + &#x27;/jobs.html?id=&#x27; + it.id, urlText:&#x27;مشاهده آگهی&#x27;});
      }
    }
  });
  return n;
}

function notify_(u, kind, title, body, ref, opt) {
  opt = opt || {};
  var t = table_(S_NOTIF);
  save_(t, {id:uid_(), to:u.mobile, kind:kind, title:title, body:String(body || &#x27;&#x27;).slice(0, 3000), ref:ref || &#x27;&#x27;, created:now_(), read:&#x27;&#x27;});
  if (u.tg_chat &amp;&amp; !opt.noDm) {
    var msg = &#x27;🔔 &#x27; + title + &#x27;\n\n&#x27; + (opt.full ? body : firstLines_(body, 12));
    var kb = opt.url ? {inline_keyboard:[[{text:opt.urlText || &#x27;باز کردن&#x27;, url:opt.url}]]} : null;
    tgSend_(u.tg_chat, msg, kb);
  }
}

function admins_() { return table_(S_ADMINS).rows.filter(function(a){ return a.chat_id; }); }

/** گیرنده‌های اعلان ادمین: کاربران ادمین (موبایل/چت تلگرام) + چت‌های ثبت‌شده در برگه‌ی ادمین‌ها. */
function adminTargets_() {
  var out = [], byChat = {};
  table_(S_USERS).rows.forEach(function(u){
    if (!isAdminUser_(u)) return;
    out.push({chat:u.tg_chat || &#x27;&#x27;, user:u});
    if (u.tg_chat) byChat[u.tg_chat] = 1;
  });

  return out;
}
function prefsOf_(u) {
  var p = parseJ_(u &amp;&amp; u.prefs, {}), o = {};
  if (!p || typeof p !== &#x27;object&#x27;) p = {};
  Object.keys(PREF_DEFAULT).forEach(function(k){ o[k] = (k in p) ? (p[k] ? 1 : 0) : PREF_DEFAULT[k]; });
  return o;
}
/** key = signup|ad|cv|private|direct|channel|daily. خروجی: [[chat,msgId],...] پیام‌های تلگرام ارسال‌شده. */
function adminSend_(key, title, text, kb, ref, exclMobile) {
  var pairs = [], ex = normMobile_(exclMobile), exu = ex &amp;&amp; OWNER_MOBILES.indexOf(ex) &lt; 0 ? find_(S_USERS, &#x27;mobile&#x27;, ex) : null;
  adminTargets_().forEach(function(t){
    var p = prefsOf_(t.user);
    if (!p[key]) return;
    // درخواست‌دهنده (اگر ادمین است) دکمه‌ی تأیید خودش را نمی‌گیرد؛ مالک مستثناست
    if (exu &amp;&amp; ((t.user &amp;&amp; t.user.mobile === exu.mobile) || (exu.tg_chat &amp;&amp; String(t.chat) === String(exu.tg_chat)))) return;
    if (p.tg &amp;&amp; t.chat) { var r = tgSend_(t.chat, text, kb); if (r &amp;&amp; r.ok) pairs.push([t.chat, r.result.message_id]); }
    if (p.app &amp;&amp; t.user) save_(table_(S_NOTIF), {id:uid_(), to:t.user.mobile, kind:&#x27;admin_&#x27; + key, title:title, body:firstLines_(text, 4).slice(0, 600), ref:ref || &#x27;&#x27;, created:now_(), read:&#x27;&#x27;});
  });
  return pairs;
}

/* =========================== تلگرام =========================== */
function postToChannel(text) {
  if (!text) { Logger.log(&#x27;متن خالی است&#x27;); return {ok:false, detail:&#x27;empty&#x27;}; }
  var j = tg_(&#x27;sendMessage&#x27;, {chat_id:CHANNEL, text:String(text).slice(0, 4000), disable_web_page_preview:true});
  if (j &amp;&amp; j.ok) return {ok:true, msgId:j.result.message_id};
  return {ok:false, detail:(j &amp;&amp; j.description) || &#x27;no response&#x27;};
}
function deleteFromChannel(msgId) { if (msgId) tg_(&#x27;deleteMessage&#x27;, {chat_id:CHANNEL, message_id:Number(msgId)}); }
function testChannel() { postToChannel(&#x27;🧪 تست اتصال ربات تخصص‌یاب&#x27;); }

function tgSend_(chat, text, kb) {
  var p = {chat_id:chat, text:String(text).slice(0, 4000), disable_web_page_preview:true};
  if (kb) p.reply_markup = kb;
  var r = tg_(&#x27;sendMessage&#x27;, p);
  if (!r || (!r.ok &amp;&amp; (!r.error_code || r.error_code === 429 || r.error_code &gt;= 500))) { // خطای گذرا (شبکه/۴۲۹/۵xx): یک بار دیگر
    try { Utilities.sleep(r &amp;&amp; r.parameters &amp;&amp; r.parameters.retry_after ? Math.min(3000, r.parameters.retry_after * 1000) : 800); } catch (e) {}
    r = tg_(&#x27;sendMessage&#x27;, p);
  }
  tgNote_(chat, r);
  return r;
}
/** نتیجه‌ی ارسال به تلگرام را ثبت می‌کند تا در پنل ادمین (کارت وضعیت) دیده شود: آخرین موفق، آخرین خطا، چت‌هایی که ربات را بسته‌اند. */
function tgNote_(chat, r) {
  try {
    var p = PropertiesService.getScriptProperties(), c = String(chat);
    if (r &amp;&amp; r.ok) {
      p.setProperty(&#x27;TG_OK&#x27;, now_());
      var bad = parseJ_(p.getProperty(&#x27;TG_BAD&#x27;), {});
      if (bad[c]) { delete bad[c]; p.setProperty(&#x27;TG_BAD&#x27;, JSON.stringify(bad)); }
      return;
    }
    var desc = String((r &amp;&amp; (r.description || r.error)) || &#x27;no response&#x27;).slice(0, 160);
    p.setProperty(&#x27;TG_ERR&#x27;, now_() + &#x27; | &#x27; + c + &#x27; | &#x27; + desc);
    p.setProperty(&#x27;TG_FAILS&#x27;, String((Number(p.getProperty(&#x27;TG_FAILS&#x27;)) || 0) + 1));
    Logger.log(&#x27;ارسال تلگرام به &#x27; + c + &#x27; ناموفق: &#x27; + desc);
    if (r &amp;&amp; (r.error_code === 403 || r.error_code === 400) &amp;&amp; /blocked|deactivated|chat not found|kicked/i.test(desc)) {
      var b2 = parseJ_(p.getProperty(&#x27;TG_BAD&#x27;), {}); b2[c] = now_(); p.setProperty(&#x27;TG_BAD&#x27;, JSON.stringify(b2));
    }
  } catch (e) {}
}
function tgStatus_() {
  var p = PropertiesService.getScriptProperties(), e = String(p.getProperty(&#x27;TG_ERR&#x27;) || &#x27;&#x27;).split(&#x27; | &#x27;), bad = parseJ_(p.getProperty(&#x27;TG_BAD&#x27;), {});
  var names = {}; table_(S_USERS).rows.forEach(function(u){ if (u.tg_chat) names[String(u.tg_chat)] = u.name || u.mobile; });
  admins_().forEach(function(a){ if (!names[String(a.chat_id)]) names[String(a.chat_id)] = a.name || a.username || &#x27;&#x27;; });
  return {lastOk:p.getProperty(&#x27;TG_OK&#x27;) || &#x27;&#x27;, lastError:e.length &gt; 2 ? e.slice(2).join(&#x27; | &#x27;) : &#x27;&#x27;, lastErrorChat:e.length &gt; 2 ? e[1] : &#x27;&#x27;, lastErrorAt:e.length &gt; 2 ? e[0] : &#x27;&#x27;,
    fails:Number(p.getProperty(&#x27;TG_FAILS&#x27;)) || 0, blocked:Object.keys(bad).map(function(c){ return {chat:c, name:names[c] || &#x27;&#x27;, at:bad[c]}; })};
}

function tg_(method, payload) {
  var token = PropertiesService.getScriptProperties().getProperty(&#x27;BOT_TOKEN&#x27;);
  if (!token) { Logger.log(&#x27;BOT_TOKEN ذخیره نشده&#x27;); return {ok:false, description:&#x27;no token&#x27;}; }
  try {
    var r = UrlFetchApp.fetch(&#x27;https://api.telegram.org/bot&#x27; + token + &#x27;/&#x27; + method,
      {method:&#x27;post&#x27;, contentType:&#x27;application/json&#x27;, payload:JSON.stringify(payload || {}), muteHttpExceptions:true});
    var j = JSON.parse(r.getContentText());
    if (!j.ok &amp;&amp; method !== &#x27;editMessageText&#x27; &amp;&amp; method !== &#x27;deleteMessage&#x27;) Logger.log(&#x27;تلگرام &#x27; + method + &#x27;: &#x27; + r.getContentText());
    return j;
  } catch (err) { Logger.log(&#x27;تلگرام خطا &#x27; + method + &#x27;: &#x27; + err); return {ok:false, description:String(err)}; }
}

function botName_() {

  if (n) return n;
  var r = tg_(&#x27;getMe&#x27;, {});
  if (r &amp;&amp; r.ok) { n = r.result.username; p.setProperty(&#x27;BOT_USERNAME&#x27;, n); return n; }
  return &#x27;Takhasosbot&#x27;;
}
function botLink_(payload) { return &#x27;https://t.me/&#x27; + botName_() + &#x27;?start=&#x27; + payload; }

/** هر دقیقه با تریگر اجرا می‌شود: پیام‌ها و دکمه‌های ربات و پست‌های کانال را می‌خواند. */
function tick() { pull_(true); try { dailySummary_(false); } catch (err) { Logger.log(&#x27;daily: &#x27; + err); } }

/** خلاصه‌ی روزانه (ساعت ۹ صبح به بعد، یک بار در روز) برای ادمین‌هایی که روشنش کرده‌اند. */
function dailySummary_(force) {
  var p = PropertiesService.getScriptProperties(), today = now_().slice(0, 10);
  if (!force &amp;&amp; (Number(now_().slice(11, 13)) &lt; 9 || p.getProperty(&#x27;DAILY_AT&#x27;) === today)) return 0;
  p.setProperty(&#x27;DAILY_AT&#x27;, today);
  return locked_(function(){
    var us = table_(S_USERS).rows.filter(function(u){ return u.status === &#x27;pending&#x27;; }).length;
    var its = table_(S_LIST).rows.filter(function(r){ return r.status === &#x27;pending&#x27; &amp;&amp; r.deleted !== &#x27;بله&#x27; &amp;&amp; (r.type === &#x27;employer&#x27; || r.type === &#x27;jobseeker&#x27;); });
    var ads = its.filter(function(r){ return r.type === &#x27;employer&#x27;; }).length, cvs = its.length - ads;
    if (!us &amp;&amp; !ads &amp;&amp; !cvs) return 0;
    var text = &#x27;🗓 خلاصه‌ی روزانه تخصص‌یاب\nعضویت در انتظار: &#x27; + us + &#x27;\nآگهی در انتظار: &#x27; + ads + &#x27;\nرزومه در انتظار: &#x27; + cvs + &#x27;\nپنل: &#x27; + SITE + &#x27;/admin.html&#x27;;
    adminSend_(&#x27;daily&#x27;, &#x27;خلاصه‌ی روزانه&#x27;, text, null, &#x27;&#x27;);
    return 1;
  });
}

function pull_(force) {
  var p = PropertiesService.getScriptProperties();
  var last = Number(p.getProperty(&#x27;TG_PULL_AT&#x27;) || 0), nowMs = new Date().getTime();
  if (!force &amp;&amp; nowMs - last &lt; 4000) return 0;
  var lock = LockService.getScriptLock();
  if (!lock.tryLock(5000)) return 0;
  var n = 0;
  _T = {};
  try {
    p.setProperty(&#x27;TG_PULL_AT&#x27;, String(nowMs));
    var off = Number(p.getProperty(&#x27;TG_OFFSET&#x27;) || 0);
    var r = tg_(&#x27;getUpdates&#x27;, {offset:off, timeout:0, limit:50, allowed_updates:[&#x27;message&#x27;,&#x27;callback_query&#x27;,&#x27;channel_post&#x27;]});
    if (!r || !r.ok) return 0;
    r.result.forEach(function(u){
      try { handleUpdate_(u); n++; } catch (err) { Logger.log(&#x27;update &#x27; + u.update_id + &#x27;: &#x27; + err + &#x27;\n&#x27; + err.stack); }
      p.setProperty(&#x27;TG_OFFSET&#x27;, String(u.update_id + 1));
    });
  } finally { lock.releaseLock(); }
  return n;
}

function handleUpdate_(up) {
  if (up.callback_query) return onCallback_(up.callback_query);
  if (up.channel_post) return onChannelPost_(up.channel_post);
  var m = up.message; if (!m || !m.chat || m.chat.type !== &#x27;private&#x27;) return;
  var chat = String(m.chat.id), from = m.from || {}, text = String(m.text || &#x27;&#x27;).trim();
  if (m.contact) return onContact_(m);
  if (/^\/start\b/.test(text)) {
    var arg = text.replace(/^\/start\s*/, &#x27;&#x27;);
    if (arg.indexOf(&#x27;adm_&#x27;) === 0) {
      if (arg.slice(4) === PropertiesService.getScriptProperties().getProperty(&#x27;ADMIN_LINK&#x27;)) return addAdmin_(m);
      return tgSend_(chat, &#x27;لینک ادمین معتبر نیست.&#x27;);
    }
    if (arg.charAt(0) === &#x27;L&#x27;) return linkUser_(m, arg.slice(1));
    if (arg.charAt(0) === &#x27;G&#x27;) return startLogin_(m, arg.slice(1));
    return tgSend_(chat, &#x27;سلام! این ربات تخصص‌یاب است 👋\nآگهی‌ها و رزومه‌ها: &#x27; + SITE + &#x27;/enter.html\nکانال: &#x27; + CHANNEL,
      {inline_keyboard:[[{text:&#x27;ورود به برنامه&#x27;, url:SITE + &#x27;/enter.html&#x27;}]]});
  }
  if (/^\/admin\b/.test(text)) {
    if (text.replace(/^\/admin\s*/, &#x27;&#x27;) === ADMIN_KEY) return addAdmin_(m);
    return tgSend_(chat, &#x27;رمز نادرست است.&#x27;);
  }
  if (isAdminChat_(chat)) return tgSend_(chat, &#x27;درخواست‌های جدید همین‌جا با دکمه‌ی ✅/❌ برایت می‌آید. پنل کامل: &#x27; + SITE + &#x27;/admin.html&#x27;);
  return tgSend_(chat, &#x27;برای ثبت آگهی یا رزومه وارد برنامه شو: &#x27; + SITE + &#x27;/enter.html&#x27;);
}

function addAdmin_(m) {
  var t = table_(S_ADMINS), chat = String(m.chat.id), a = findIn_(t, &#x27;chat_id&#x27;, chat), from = m.from || {};
  if (!a) a = {chat_id:chat, added:now_()};
  a.username = from.username || &#x27;&#x27;; a.name = ((from.first_name || &#x27;&#x27;) + &#x27; &#x27; + (from.last_name || &#x27;&#x27;)).trim();
  save_(t, a);
  tgSend_(chat, &#x27;✅ ادمین تخصص‌یاب شدی. از این به بعد درخواست‌های عضویت، آگهی‌ها و رزومه‌ها با دکمه‌ی تأیید/رد همین‌جا می‌آید.&#x27;);
  return true;
}
function isAdminChat_(chat) { return !!find_(S_ADMINS, &#x27;chat_id&#x27;, String(chat)); }

function linkUser_(m, code) {
  var chat = String(m.chat.id), t = table_(S_USERS), u = code ? findIn_(t, &#x27;link_code&#x27;, code) : null;
  if (!u) return tgSend_(chat, &#x27;این لینک معتبر نیست. از داخل برنامه دوباره «اتصال تلگرام» را بزن.&#x27;);
  u.tg_chat = chat; u.tg_user = (m.from &amp;&amp; m.from.username) || &#x27;&#x27;; save_(t, u);
  var msg = &#x27;سلام &#x27; + (u.name || &#x27;&#x27;) + &#x27;! تلگرامت به تخصص‌یاب وصل شد ✅\n&#x27;;
  msg += u.status === &#x27;approved&#x27; ? (&#x27;عضویتت فعال است.\nلینک کانال: &#x27; + u.invite) : &#x27;درخواست عضویتت برای ادمین رفته؛ نتیجه همین‌جا خبرت می‌کنیم.&#x27;;
  msg += &#x27;\n\nبرای امنیت بیشتر، با دکمه‌ی پایین شماره‌ات را تأیید کن.&#x27;;
  tgSend_(chat, msg, {keyboard:[[{text:&#x27;📱 تأیید شماره موبایل&#x27;, request_contact:true}]], resize_keyboard:true, one_time_keyboard:true});
  if (u.tg &amp;&amp; u.status === &#x27;pending&#x27;) editAdminMsgs_(u.tg, adminUserText_(u));
  return true;
}

function startLogin_(m, nonce) {
  var chat = String(m.chat.id), cache = CacheService.getScriptCache(), raw = cache.get(&#x27;ln_&#x27; + nonce);
  if (!raw) return tgSend_(chat, &#x27;این لینک ورود منقضی شده؛ در برنامه دوباره «ورود» را بزن.&#x27;);

    {keyboard:[[{text:&#x27;📱 ارسال شماره و ورود&#x27;, request_contact:true}]], resize_keyboard:true, one_time_keyboard:true});
}

function onContact_(m) {
  var chat = String(m.chat.id), c = m.contact;
  if (!c || String(c.user_id) !== String(m.from.id)) return tgSend_(chat, &#x27;لطفاً شماره‌ی خودت را با همان دکمه بفرست.&#x27;, {remove_keyboard:true});
  var mobile = normMobile_(c.phone_number), t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, mobile);
  var cache = CacheService.getScriptCache(), nonce = cache.get(&#x27;lchat_&#x27; + chat);
  if (!u) return tgSend_(chat, &#x27;با شماره‌ی &#x27; + mobile + &#x27; هنوز در تخصص‌یاب ثبت‌نام نشده. از برنامه ثبت‌نام کن: &#x27; + SITE + &#x27;/register.html&#x27;, {remove_keyboard:true});
  if (u.tg_chat &amp;&amp; u.tg_chat !== chat &amp;&amp; !nonce) return tgSend_(chat, &#x27;این شماره به حساب تلگرام دیگری وصل است.&#x27;, {remove_keyboard:true});
  u.tg_chat = chat; u.tg_user = m.from.username || &#x27;&#x27;; u.verified = &#x27;1&#x27;; save_(t, u);
  if (nonce) {
    var raw = cache.get(&#x27;ln_&#x27; + nonce);
    if (raw) { var o = JSON.parse(raw); if (o.mobile === mobile) { o.ok = true; cache.put(&#x27;ln_&#x27; + nonce, JSON.stringify(o), 600); cache.remove(&#x27;lchat_&#x27; + chat);
      return tgSend_(chat, &#x27;✅ ورود تأیید شد. به برنامه برگرد.&#x27;, {remove_keyboard:true}); }
      return tgSend_(chat, &#x27;شماره‌ی تلگرام با شماره‌ای که در برنامه زدی یکی نیست.&#x27;, {remove_keyboard:true}); }
  }
  return tgSend_(chat, &#x27;✅ شماره‌ات تأیید شد. ممنون!&#x27;, {remove_keyboard:true});

function stats_(users, rows) {
  var days = [], idx = {}, k;

  var med = function(a){ if (!a.length) return 0; a.sort(function(x, y){ return x - y; }); return Math.round(a[Math.floor(a.length / 2)]); };
  var uMin = [], iMin = [], ur = 0, ua = 0, ir = 0, ia = 0;
  users.forEach(function(u){

  });

    if (i != null &amp;&amp; r.src !== &#x27;channel&#x27;) { if (r.type === &#x27;employer&#x27;) days[i].a++; else days[i].c++; }

var SMS_TTL = 300, SMS_RESEND = 60, SMS_HOURLY = 5, SMS_TRIES = 5, SMS_DEFAULT_CAP = 300, SMS_BURST = 40;

function smsCfg_() {
  var p = PropertiesService.getScriptProperties(), g = function(k){ return String(p.getProperty(k) || &#x27;&#x27;).trim(); };

    relay:g(&#x27;SMS_RELAY_URL&#x27;), relaySecret:g(&#x27;SMS_RELAY_SECRET&#x27;), cap:Number(g(&#x27;SMS_DAILY_CAP&#x27;)) &gt; 0 ? Math.floor(Number(g(&#x27;SMS_DAILY_CAP&#x27;))) : SMS_DEFAULT_CAP};

}
function features_() {
  var f = {}; Object.keys(FEATURES).forEach(function(k){ f[k] = FEATURES[k]; });

}
/** کد ۵ رقمی از تولیدکننده‌ی تصادفیِ UUID (Math.random برای کد ورود مناسب نیست). */

/** مقایسه‌ی زمان‌ثابت دو رشته. */

/** زیر قفل صدا زده شود. محدودیت‌ها را می‌سنجد، شمارنده‌ها را رزرو می‌کند و کد را در کش می‌گذارد (کد هرگز برگردانده/لاگ نمی‌شود). */

  var c = smsCfg_(), res, body, status;

/** شماره با پیامک تأیید شد. اگر ثبت‌نام تازه در انتظار تأیید پیامکی بود، حالا به ادمین‌ها خبر می‌رود. */
function markVerified_(mobile) {
  var t = table_(S_USERS), u = findIn_(t, &#x27;mobile&#x27;, mobile); if (!u) return null;

/* =========================== کمکی =========================== */
function pubUser_(u) {
  return {mobile:u.mobile, name:u.name, role:u.role, status:u.status, tg:!!u.tg_chat, tg_user:u.tg_user, verified:vOk_(u), needVerify:u.verified === &#x27;w&#x27;,
    invite:u.status === &#x27;approved&#x27; ? u.invite : &#x27;&#x27;, interests:u.interests || &#x27;&#x27;, city:u.city || &#x27;&#x27;, tgLink:botLink_(&#x27;L&#x27; + u.link_code), isAdmin:isAdminUser_(u),

function addToken_(tokens, t) { var a = String(tokens || &#x27;&#x27;).split(&#x27; &#x27;).filter(String); a.push(t); return a.slice(-5).join(&#x27; &#x27;); }
function toEn_(s) { return String(s || &#x27;&#x27;).replace(/[۰-۹]/g, function(c){ return String(c.charCodeAt(0) - 1776); }).replace(/[٠-٩]/g, function(c){ return String(c.charCodeAt(0) - 1632); }); }
function normMobile_(s) {
  var d = toEn_(String(s == null ? &#x27;&#x27; : s)).replace(/\D/g, &#x27;&#x27;);
  var m = d.match(/(?:0098|98|0)?(9\d{9})/);
  if (!m) return &#x27;&#x27;;
  if (d.length &gt; 14) { var mm = toEn_(String(s)).match(/(?:\+98|0098|0)?9\d{9}/); if (!mm) return &#x27;&#x27;; return &#x27;0&#x27; + mm[0].replace(/\D/g, &#x27;&#x27;).slice(-10); }

  var tags = s.match(/#[^\s#،,]+/g) || [];
  tags.forEach(function(tg){
    var t = CAT_ALIASES[tg] || tg;
    CATS.forEach(function(c){ if (c[0] === t &amp;&amp; out.indexOf(t) &lt; 0) out.push(t); });
  });

function cityOk_(a, b) {

  if (!a || !b) return true;
  return a === b || a.indexOf(&#x27;دورکار&#x27;) &gt;= 0 || b.indexOf(&#x27;دورکار&#x27;) &gt;= 0;

var CITY_RE = /(تهران|مشهد|اصفهان|شیراز|تبریز|کرج|قم|اهواز|رشت|کرمان|یزد|ساری|قزوین|ارومیه|همدان|دورکاری)/;

function firstLines_(s, n) { return String(s || &#x27;&#x27;).split(&#x27;\n&#x27;).filter(function(l){ return l.trim(); }).slice(0, n).join(&#x27;\n&#x27;); }
function roleFa_(r) { return r === &#x27;employer&#x27; ? &#x27;کارفرما&#x27; : (r === &#x27;jobseeker&#x27; ? &#x27;کارجو&#x27; : &#x27;نامشخص&#x27;); }

function rand_(n) { var a = &#x27;abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789&#x27;, s = &#x27;&#x27;; for (var i = 0; i &lt; n; i++) s += a.charAt(Math.floor(Math.random() * a.length)); return s; }

var _SSTZ = null;
